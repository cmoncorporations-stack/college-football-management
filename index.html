    <span class="attr-v">${v}</span></div>`;
  const hist=(p.hist||[]).slice().reverse();
  return `<div class="ovl-p wide">
    <div class="ovl-eye">${hof?"Hall of Fame":"Player file"}</div>
    <div class="ovl-h">${esc(p.name)}</div>
    <div class="pdet">
      <div class="pdet-card">${playerCard(p,team)}</div>
      <div class="pdet-body">
        ${bar("Overall",p.ovr,99)}
        ${bar("Potential",p.pot,99)}
        ${bar("Morale",p.mor??70,99)}
        <div class="muted" style="font-size:13px;margin:10px 0 4px">
          ${p.pos} · ${YEARS[p.year]} · ${esc(SCHOOLS[team].n)}${p.inj>0?` · {ic:injury} out ${p.inj}w`:""}${p.rs?" · redshirting":""}
        </div>
        <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:12px 0 6px">Career totals</h3>
        <div class="muted" style="font-size:13px">${esc(statline({pos:p.pos,ovr:p.ovr,st:car}))} · ${car.gp} game${car.gp!==1?"s":""}</div>
        <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:14px 0 6px">Season by season</h3>
        ${hist.length?`<table><tr><th>Season</th><th>Yr</th><th class="num">OVR</th><th>Line</th></tr>
          ${hist.map(h=>`<tr><td>${h.season}</td><td>${YEARS[h.year]}</td><td class="num">${h.ovr}</td>
            <td class="muted">${esc(statline({pos:p.pos,ovr:h.ovr,st:h.st}))}</td></tr>`).join("")}</table>`
          :`<div class="muted" style="font-size:13px">${p.st&&p.st.gp?"First season in progress — "+esc(statline(p)):"No completed seasons yet."}</div>`}
      </div>
    </div>
    <div class="ovl-foot"><span></span><button class="ovl-x" onclick="closeModal()">Close</button></div>
  </div>`;
}

/* --- L2-4: achievement toasts --- */
let toastTimer=null;
function renderToasts(){
  if(!state.toasts||!state.toasts.length) return "";
  return `<div class="toasts">${state.toasts.map(t=>`<div class="toast">
    <div class="t-e">${T("Achievement unlocked")}</div>
    <div class="t-t">${IC(t.i,15,"color:var(--accent);margin-right:6px")}${esc(t.n)}</div>
    <div class="t-s">${esc(t.s)}</div></div>`).join("")}</div>`;
}
function scheduleToastClear(){
  if(toastTimer||!state.toasts||!state.toasts.length) return;
  toastTimer=setTimeout(()=>{
    toastTimer=null;
    if(state){ state.toasts=[]; save(); render(); }
  },6500);
}

function renderOverlay(){
  let out="";
  if(state.oq&&state.oq.length){
    const o=state.oq[0];
    const body=o.t==="recap"?renderRecap(o.d)
      :o.t==="pack"?renderPack(o.d)
      :o.t==="cer"?renderCer(o.d)
      :o.t==="camp"?renderCamp(o.d):"";
    out+=`<div class="ovl">${body}</div>`;
  }
  if(state.modal&&state.modal.t==="player") out+=`<div class="ovl">${renderPlayerModal(state.modal.id)}</div>`;
  out+=renderToasts();
  return out;
}

/* ============================ persistence ============================ */
/* Saves live in three slots. `cfbgm2` was the old single-slot key and is imported into slot 0 once. */
const SLOTS=3, SLOT_KEY=i=>"cfbgm3_s"+i, ACTIVE_KEY="cfbgm3_active", LEGACY_KEY="cfbgm2";
let activeSlot=0;
function weekName(w){
  if(w===0) return T("Preseason");
  if(w<=REG_WEEKS) return T("Week")+" "+w;
  if(w===CONF_WEEK) return T("Conference Championships");
  if(w===SEMI_WEEK) return T("Playoff Semifinals");
  if(w===FINAL_WEEK) return T("National Championship");
  return T("Offseason");
}
function exportSlot(i){
  try{
    const raw=localStorage.getItem(SLOT_KEY(i)); if(!raw) return;
    const d=JSON.parse(raw), st=d.state;
    const url=URL.createObjectURL(new Blob([JSON.stringify({app:"gridiron-gm",state:st,nextId:d.nextId,saved:Date.now()})],
      {type:"application/json"}));
    const a=document.createElement("a");
    a.href=url;
    a.download=`gridiron-${SCHOOLS[st.userTeam].n.toLowerCase().replace(/\W+/g,"-")}-${st.season}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){ alert(T("The file could not be read.")); }
}
function slotMeta(i){
  try{
    const d=JSON.parse(localStorage.getItem(SLOT_KEY(i)));
    if(!d||!d.state) return null;
    const s=d.state, u=s.teams[s.userTeam];
    return {team:s.userTeam,season:s.season,week:s.week,
      rec:u.wins+"-"+u.losses,
      career:s.career?`${s.career.wins}-${s.career.losses}`:"0-0",
      titles:(s.career?s.career.natTitles:0),
      fired:!!s.fired,saved:d.saved||null};
  }catch(e){ return null; }
}
function save(){
  if(!state) return; // nothing to write from the home screen — never blank a slot
  try{ localStorage.setItem(SLOT_KEY(activeSlot),JSON.stringify({state,nextId,saved:Date.now()}));
       localStorage.setItem(ACTIVE_KEY,String(activeSlot)); }catch(e){}
}
function migrate(s){
  if(s.version===3){ // v3 → v4: overlays, poll history. Keep the career intact.
    s.oq=[]; s.prevPoll=null; s.recapOn=true;
    s.version=4;
  }
  if(s.version===4){ // v4 → v5: player history, records, HoF, achievements, visits, rivalries
    s.records=null; s.hof=[]; s.achv={}; s.toasts=[]; s.visits=3;
    s.rivalStreak=0; s.wasFired=!!s.fired; s.modal=null;
    for(const t of s.teams) for(const p of t.players) if(!p.hist) p.hist=[];
    for(const r of s.recruits||[]){ if(!r.pers) r.pers=pick(Object.keys(PERS)); if(r.visited===undefined) r.visited=false; }
    // rivalry week only exists in newly built schedules; the current season keeps its old one
    s.version=5;
  }
  if(s.version===5){ // v5 → v6: language, sim stops, onboarding
    s.lang=s.lang||"en";
    s.simStops=s.simStops||{injury:true,rivalry:true,playoff:true};
    s.onboard=s.onboard||{tabs:{},hidden:false};
    s.version=6;
  }
  if(s.version===6){ // v6 → v7: the sequence-based coach mode replaces the old drive engine.
    s.live=null;     // an in-progress old-format game can't resume; the week itself is untouched
    s.version=7;
  }
  return s;
}
function loadSlot(i){
  try{const d=JSON.parse(localStorage.getItem(SLOT_KEY(i)));
    if(d&&d.state&&d.state.version>=3&&d.state.version<=7){
      state=migrate(d.state); nextId=d.nextId||500000; activeSlot=i;
      localStorage.setItem(ACTIVE_KEY,String(i));
      return true;}
  }catch(e){}
  return false;
}
function adoptLegacySave(){ // one-time: the pre-slot save becomes slot 0
  try{
    const old=localStorage.getItem(LEGACY_KEY);
    if(!old) return;
    if(!localStorage.getItem(SLOT_KEY(0))) localStorage.setItem(SLOT_KEY(0),old);
    localStorage.removeItem(LEGACY_KEY);
  }catch(e){}
}
function anySlotUsed(){ for(let i=0;i<SLOTS;i++) if(slotMeta(i)) return true; return false; }
let pickingTeam=false;
function newCareerIn(i){ activeSlot=i; state=null; pickingTeam=true; render(); }
function backToHome(){ state=null; pickingTeam=false; render(); }
/* Explicit save + exit. The game already autosaves, but players need a visible
   way to put a career down and come back to the career list. */
function saveAndExit(){
  if(state){ save(); lastExit={team:state.userTeam,season:state.season,slot:activeSlot}; }
  backToHome();
}
let lastExit=null;
/* Start a new career: pick a free slot, or let the player choose one to replace. */
function startNewCareer(){
  for(let i=0;i<SLOTS;i++) if(!slotMeta(i)){ newCareerIn(i); return; }
  const list=[];
  for(let i=0;i<SLOTS;i++){ const m=slotMeta(i); list.push(`${i+1}. ${SCHOOLS[m.team].n} — ${T("Season")} ${m.season} (${m.rec})`); }
  const ans=prompt(T("All three slots are in use. Type 1, 2 or 3 to replace that career:")+"\n\n"+list.join("\n"));
  const n=parseInt(ans,10);
  if(!n||n<1||n>SLOTS) return;
  const m=slotMeta(n-1);
  if(!confirm(T("Replace the {0} career in slot {1}? This cannot be undone.",SCHOOLS[m.team].n,n))) return;
  localStorage.removeItem(SLOT_KEY(n-1));
  newCareerIn(n-1);
}
function deleteSlot(i){
  const m=slotMeta(i); if(!m) return;
  if(!confirm(T("Delete the {0} career in slot {1}? This cannot be undone.",SCHOOLS[m.team].n,i+1))) return;
  localStorage.removeItem(SLOT_KEY(i));
  if(activeSlot===i) state=null;
  render();
}
function resetGame(){ localStorage.removeItem(SLOT_KEY(activeSlot)); state=null; render(); }

/* --- L3-1: export / import a career --- */
function exportSave(){
  if(!state) return;
  const payload=JSON.stringify({app:"gridiron-gm",state,nextId,saved:Date.now()});
  const url=URL.createObjectURL(new Blob([payload],{type:"application/json"}));
  const a=document.createElement("a");
  a.href=url;
  a.download=`gridiron-${SCHOOLS[state.userTeam].n.toLowerCase().replace(/\W+/g,"-")}-${state.season}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importSave(input){
  const file=input.files&&input.files[0];
  input.value="";
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      const s=d&&d.state;
      if(!s||!Array.isArray(s.teams)||s.teams.length!==32||typeof s.season!=="number"||typeof s.userTeam!=="number")
        throw new Error("not a Gridiron GM save");
      if(!(s.version>=3&&s.version<=7)) throw new Error("save version "+s.version+" is not supported");
      const cur=slotMeta(activeSlot);
      if(cur&&!confirm(T("Importing will overwrite the career in slot {0}. Continue?",activeSlot+1))) return;
      state=migrate(s); nextId=d.nextId||500000;
      save(); render();
      alert(T("Career imported: {0}, {1} season.",SCHOOLS[state.userTeam].n,state.season));
    }catch(e){
      alert(T("That file could not be loaded ({0}). Pick a .json exported from Gridiron GM.",e.message));
    }
  };
  fr.onerror=()=>alert(T("The file could not be read."));
  fr.readAsText(file);
}

function weekLabel(){
  if(state.week===0)return "Preseason";
  if(state.week<=REG_WEEKS)return "Week "+state.week;
  if(state.week===CONF_WEEK)return "Conf. Championships";
  if(state.week===SEMI_WEEK)return "Playoff Semifinals";
  if(state.week===FINAL_WEEK)return "National Championship";
  return "Offseason — Signing Day & Portal";
}
function advLabel(){
  if(state.week===SIGN_WEEK)return "Start "+(state.season+1)+" Season →";
  if(state.week===REG_WEEKS)return "Play Conf. Championships →";
  if(state.week===CONF_WEEK)return "Play Semifinals →";
  if(state.week===SEMI_WEEK)return "Play National Final →";
  if(state.week===FINAL_WEEK)return "Go to Signing Day →";
  return "Play "+(state.week===0?"Week 1":"Week "+(state.week+1))+" →";
}

/* ===== Gridiron GM mark — an ESPN-style broadcast shield ===== */
/* The Gridiron GM crest, supplied as artwork. Two rasters so small placements
   stay light; aspect ratio 1:1.1406 comes from the source file. */
const LOGO_RATIO=1.1406;
function LOGO(w){
  const h=Math.round(w*LOGO_RATIO);
  const src=w<=90?"logo-sm.png":"logo.png";   // keep every placement at 2x or better
  return `<img class="gg-logo" src="${src}" width="${w}" height="${h}" alt="Gridiron GM — College Football Manager" decoding="async">`;
}

const CHARGES=[
 '<path d="M22 40c-6-9-4-19 3-23 2 5 6 9 11 10-5 4-10 8-14 13zm36 0c6-9 4-19-3-23-2 5-6 9-11 10 5 4 10 8 14 13z"/><circle cx="40" cy="38" r="7"/>',

 '<path d="M14 52l16-28 9 15 6-9 21 22z"/>',

function rgbOf(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(h,f){const [r,g,b]=rgbOf(h);
  const c=v=>Math.max(0,Math.min(255,Math.round(f<1?v*f:v+(255-v)*(f-1)/1.6)));
  return `rgb(${c(r)},${c(g)},${c(b)})`;}
function lumOf(h){const [r,g,b]=rgbOf(h);return (0.2126*r+0.7152*g+0.0722*b)/255;}
function crestSVG(i,size){
  const t=SCHOOLS[i], c1=t.col, light=lumOf(c1)>0.42;
  const c2=light?shade(c1,0.5):shade(c1,1.55);
  const ink=light?"#0f1319":"#ffffff";
  const shape=i%4, division=(i>>2)%3, charge=CHARGES[i%CHARGES.length];
  let outline;
  if(shape===0) outline="M40 3 L74 14 v28c0 21-16 31-34 35C22 73 6 63 6 42V14z";
  else if(shape===1) outline="M40 3 a37 37 0 1 1 -0.1 0z";
  else if(shape===2) outline="M8 6 h64 v46 l-32 25 -32-25z";
  else outline="M40 3 L72 21 v38 L40 77 L8 59 V21z";
  const divs=["",
    `<rect x="0" y="34" width="80" height="12" fill="${c2}"/>`,
    `<path d="M0 46 L40 24 L80 46 v34 H0z" fill="${c2}"/>`][division];
  const u="c"+i+(size||"");
  return `<svg viewBox="0 0 80 80" width="${size||34}" height="${size||34}" class="crest" role="img" aria-label="${esc(t.n)}">
   <defs>
    <clipPath id="cp${u}"><path d="${outline}"/></clipPath>
    <linearGradient id="gl${u}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".48" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient>
    <linearGradient id="mt${u}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#9aa6bb"/>
      <stop offset=".52" stop-color="#ffffff"/><stop offset=".76" stop-color="#7c889e"/>
      <stop offset="1" stop-color="#eef1f6"/></linearGradient>
   </defs>
   <g clip-path="url(#cp${u})">
     <rect width="80" height="80" fill="${c1}"/>${divs}
     <g transform="translate(3.5,2) scale(0.92)" fill="${ink}" fill-opacity=".82" color="${ink}">${charge}</g>
     <rect width="80" height="80" fill="url(#gl${u})"/>
   </g>
   <path d="${outline}" fill="none" stroke="url(#mt${u})" stroke-width="3.6"/>
   <text x="40" y="${shape===2?66:70}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif"
     font-weight="800" font-size="15" fill="url(#mt${u})" letter-spacing="1">${abbrev(i)}</text>
  </svg>`;
}

/* ===== Topps-style chrome player cards ===== */
function rarity(p){
  if(p.ovr>=85)return{k:"r-uni",l:"SUPERFRACTOR"};
  if(p.ovr>=78)return{k:"r-sr",l:"GOLD REFRACTOR"};
  if(p.ovr>=70)return{k:"r-rare",l:"ORANGE REFRACTOR"};
  if(p.ovr>=60)return{k:"r-lim",l:"BLUE REFRACTOR"};
  return{k:"r-com",l:"BASE CHROME"};
}
function jersey(p){
  const n=typeof p.id==="number"?p.id:parseInt(String(p.id).replace(/\D/g,""),10)||7;
  return (n*37)%98+1;
}
const SKINS=["#f0c9a4","#e0ab7f","#c98a5e","#a4693f","#7d4a2a","#5c3520"];
/* helmeted three-quarter bust in the programme's colours */
function playerFigure(p,teamIdx){
  const n=typeof p.id==="number"?p.id:parseInt(String(p.id).replace(/\D/g,""),10)||7;
  const rnd=(k)=>((n*9301+k*49297)%233280)/233280;
  const t=SCHOOLS[teamIdx], c1=t.col, light=lumOf(c1)>0.42;
  const c2=light?shade(c1,0.45):shade(c1,1.6);
  const skin=SKINS[Math.floor(rnd(3)*SKINS.length)];
  const eyeBlack=rnd(5)<0.55, num=jersey(p);
  const u="f"+p.id;
  return `<svg viewBox="0 0 120 132" class="tc-fig" preserveAspectRatio="xMidYMax meet">
   <defs>
     <linearGradient id="js${u}" x1="0" y1="0" x2="0" y2="1">
       <stop offset="0" stop-color="${shade(c1,1.25)}"/><stop offset="1" stop-color="${shade(c1,0.7)}"/></linearGradient>
     <linearGradient id="hm${u}" x1=".2" y1="0" x2=".8" y2="1">
       <stop offset="0" stop-color="${shade(c1,1.6)}"/><stop offset=".45" stop-color="${c1}"/>
       <stop offset="1" stop-color="${shade(c1,0.55)}"/></linearGradient>
   </defs>
   <!-- shoulder pads + jersey -->
   <path d="M60 74c-22 0-38 10-44 30-1.5 5-2 12-2 28h92c0-16-.5-23-2-28-6-20-22-30-44-30z" fill="url(#js${u})"/>
   <path d="M32 86c5 18 12 30 28 46h-9C38 116 30 100 27 90zm56 0c-5 18-12 30-28 46h9c13-16 21-32 24-42z" fill="${c2}" opacity=".9"/>
   <path d="M60 74c-6 0-11 .6-15 1.7 3 6 8 9.3 15 9.3s12-3.3 15-9.3c-4-1.1-9-1.7-15-1.7z" fill="#000" opacity=".35"/>
   <text x="60" y="122" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif"
     font-weight="800" font-size="30" fill="#fff" opacity=".92">${num}</text>
   <!-- neck -->
   <path d="M50 62h20v16H50z" fill="${skin}"/><path d="M50 68c6 4 14 4 20 0v-6H50z" fill="#000" opacity=".28"/>
   <!-- helmet shell -->
   <path d="M60 10c-18 0-30 13-30 30v10c0 6 4 10 9 10h42c5 0 9-4 9-10V40c0-17-12-30-30-30z" fill="url(#hm${u})"/>
   <path d="M57 10.2c-16 1-27 14-27 29.8v10h6V40c0-14 9-25 21-29.8z" fill="#fff" opacity=".18"/>
   <path d="M56 10h8v50h-8z" fill="${c2}" opacity=".95"/>
   <path d="M58.6 10h2.8v50h-2.8z" fill="#fff" opacity=".55"/>
   <!-- face opening -->
   <path d="M39 40c0-10 8-16 21-16s21 6 21 16v6c0 5-3 8-8 8H47c-5 0-8-3-8-8z" fill="${skin}"/>
   <path d="M39 40c0-10 8-16 21-16s21 6 21 16v3H39z" fill="#000" opacity=".22"/>
   ${eyeBlack?`<path d="M46 44h9v4h-9zM65 44h9v4h-9z" fill="#14181d" opacity=".85"/>`
             :`<ellipse cx="50.5" cy="45" rx="3" ry="2.2" fill="#fff"/><circle cx="51" cy="45" r="1.3" fill="#2a2118"/>
               <ellipse cx="69.5" cy="45" rx="3" ry="2.2" fill="#fff"/><circle cx="70" cy="45" r="1.3" fill="#2a2118"/>`}
   <path d="M52 55q8 3 16 0" stroke="#7d4535" stroke-width="1.8" fill="none" stroke-linecap="round"/>
   <!-- facemask -->
   <g stroke="#c8ccd2" stroke-width="2.6" fill="none" stroke-linecap="round">
     <path d="M38 47c0 9 6 15 13 17h18c7-2 13-8 13-17"/>
     <path d="M40 55h40M44 62h32M60 50v29"/>

   <path d="M30 44h6v14h-6zM84 44h6v14h-6z" fill="${c2}"/>

function playerCard(p,teamIdx,subOverride){
  const r=rarity(p);
  const st=p.st&&p.st.gp?statline(p):YEARS[p.year]==="FR"?T("incoming season"):T("no games yet");
  const flags=`${p.inj>0?` · ${T("out {0}w",p.inj)}`:""}${p.rs?" · "+T("redshirt"):""}`;
  return `<div class="tcard ${r.k}" title="${esc(p.name)} — ${r.l} · POT ${p.pot} · MOR ${p.mor??70}">
    <div class="tc-frame">
      <div class="tc-photo">
        <span class="glow"></span>
        <span class="tc-rar">${r.l}</span>
        <span class="tc-ovr">${p.ovr}</span>
        ${playerFigure(p,teamIdx)}
        <span class="tc-shine"></span>
      </div>
      <div class="tc-plate">
        <span class="tc-crest">${crestSVG(teamIdx,26)}</span>
        <span class="tc-txt">
          <span class="tc-name">${esc(p.name)}</span>
          <span class="tc-sub">${subOverride?esc(subOverride):`${esc(SCHOOLS[teamIdx].n)} <b>//</b> ${p.pos} · ${YEARS[p.year]}${flags}`}</span>
        </span>
      </div>
      <div class="tc-foot"><span>POT ${p.pot}</span><span>${esc(st)}</span></div>
    </div>
  </div>`;
}

function render(){
  if(!state){
    if(pickingTeam||!anySlotUsed()) renderSelect(); else app.innerHTML=renderHome();
    return;
  }
  if(state.live){app.innerHTML=renderLive()+renderOverlay(); scheduleToastClear(); return;}
  const s=SCHOOLS[state.userTeam], u=state.teams[state.userTeam];
  const r=teamRating(u);
  const conf=state.confidence;
  const confCol=conf>=60?"var(--good)":conf>=30?"var(--accent)":"var(--bad)";
  const rk=userRank();
  document.documentElement.style.setProperty("--team",s.col);
  const NAV=[["dash",T("Dashboard"),IC("dash",17)],["roster",T("Roster"),IC("roster",17)],["sched",T("Schedule"),IC("sched",17)],["stand",T("Standings"),IC("stand",17)],["stats",T("Stats"),IC("stats",17)],["recruit",T("Recruiting"),IC("recruit",17)],["staff",T("Staff"),IC("staff",17)],["strategy",T("Strategy"),IC("strategy",17)],["budget",T("Budget"),IC("budget",17)],["hist",T("History"),IC("history",17)]];
  const titles=Object.fromEntries(NAV.map(([k,l])=>[k,l]));
  const simBtn=(state.week<SIGN_WEEK&&!state.fired)
    ?`<button class="btn-sm" style="padding:11px 14px;font-size:14px" onclick="simToEnd()" title="${esc(T("Simulate week by week until the season ends, pausing on key events"))}">${IC("forward",15,"margin-right:6px")}${T("Sim season")}</button>`:"";
  const actions=state.fired
    ?`<button class="btn-sm" onclick="backToHome()">${IC("arrowl",13,"margin-right:5px")}${T("Careers")}</button>
      <button class="btn-advance" style="background:var(--bad);color:#fff" onclick="resetGame()">${T("Start Over")}</button>`
    :(state.week===SIGN_WEEK
      ?`<button class="btn-advance" onclick="startNewSeason()">${advLabel()}</button>`
      :(pendingUserGame()
        ?`<button class="btn-sm" style="padding:11px 18px;font-size:14px" onclick="startLive()">${IC("headset",15,"margin-right:6px")}${T("Coach Game")}</button>
           ${simBtn}
           <button class="btn-advance" onclick="advanceWeek()">${T("Quick Sim")} →</button>`
        :`${simBtn}<button class="btn-advance" onclick="advanceWeek()">${advLabel()}</button>`));
  app.innerHTML=`
  <div class="shell">
    <aside class="side">
      <div class="brandmark">${LOGO(58)}</div>
      <div class="brand">
        ${crestSVG(state.userTeam,40)}
        <div><div class="bn">${esc(s.n)}</div><div class="bm">${esc(s.m)} · ${CONFS[s.c].replace(" League","")}</div></div>
      </div>
      <div class="ctx">
        <div class="ctxrow"><span>${T("Season")}</span><b>${state.season}</b></div>
        <div class="ctxrow"><span>${T("Phase")}</span><b>${weekLabel()}</b></div>
        <div class="ctxrow"><span>${T("Playbook")}</span><b>${OFF_SCHEMES[u.off].name}</b></div>
        <div class="ctxrow"><span>${T("Defense")}</span><b>${DEF_SCHEMES[u.def].name}</b></div>
        <div class="ctxrow"><span>${T("Coach rep")}</span><b>${coachRep()}/99</b></div>
      </div>
      <nav class="nav">${NAV.map(([k,l,i])=>`<a class="${state.tab===k?"on":""}" onclick="setTab('${k}')"><span class="ic">${i}</span>${l}</a>`).join("")}</nav>
      <div class="sidefoot">
        <div class="sf-l">${T("Board confidence")}</div>
        <div class="meter"><div style="width:${conf}%;background:${confCol}"></div></div>
        <div class="sf-v" style="color:${confCol}">${conf}%${state.fired?" · "+T("FIRED"):conf<30?" · "+T("hot seat"):""}</div>
        <div class="savebar">
          <span class="savedot" title="${esc(T("Your career saves automatically after every action."))}">
            ${IC("check",11)} ${T("Saved")} · ${T("Slot {0}",activeSlot+1)}
          </span>
          <button class="btn-sm exitbtn" onclick="saveAndExit()" title="${esc(T("Save and return to the career list"))}">
            ${IC("arrowl",12,"margin-right:5px")}${T("Save & quit")}
          </button>
        </div>
      </div>
    </aside>
    <main class="main">
      <div class="pagehead">
        <div>
          <h1>${titles[state.tab]}</h1>
          <div class="crumb">
            ${rk?`<span class="chip gold">#${rk}</span>`:'<span class="chip">NR</span>'}
            <span class="chip">${u.wins}–${u.losses}</span>
            <span class="chip">${T("Off")} ${Math.round(r.off)}</span>
            <span class="chip">${T("Def")} ${Math.round(r.def)}</span>
            <span class="chip">${T("Prestige")} ${u.prestige}</span>
          </div>
        </div>
        <div class="actions">${actions}</div>
      </div>
      ${(state.onboard&&state.onboard.fresh===state.tab&&TAB_HINTS[state.tab])
        ?`<div class="hintbar"><span>${IC("bulb",15,"color:var(--accent);margin-right:7px")}${T(TAB_HINTS[state.tab])}</span><button class="btn-sm" onclick="dismissHint()">${T("Got it")}</button></div>`:""}
      ${{dash:renderDash,roster:renderRoster,sched:renderSched,stand:renderStand,stats:renderStats,recruit:renderRecruit,staff:renderStaff,strategy:renderStrategy,budget:renderBudget,hist:renderHist}[state.tab]()}
    </main>
  </div>`+renderOverlay();
  scheduleToastClear();
}
function setTab(t){
  state.tab=t;
  if(!state.onboard) state.onboard={tabs:{},hidden:false};
  if(!state.onboard.tabs) state.onboard.tabs={};
  if(!state.onboard.tabs[t]){ state.onboard.tabs[t]=true; state.onboard.fresh=t; }
  else state.onboard.fresh=null;
  save(); render();
}
function dismissHint(){ if(state.onboard) state.onboard.fresh=null; save(); render(); }

function langToggle(){

function nextOpponent(){
  if(state.week>=REG_WEEKS) return null;
  const g=state.schedule[state.week].find(g=>g.h===state.userTeam||g.v===state.userTeam);
  if(!g) return null;
  const home=g.h===state.userTeam;
  return {idx:home?g.v:g.h,home,conf:g.conf};
}

      <td>${starters.has(p.id)?IC("star",12,"color:var(--accent);margin-right:4px"):""}${playerLink(p)}</td><td>${p.pos}</td><td>${YEARS[p.year]}${p.rs?' <span class="tag y">RS</span>':""}</td>

      <td class="num" style="color:${morCol};font-weight:700">${mor}</td>

  </table></div></div>`;
}

function renderSched(){
  const u=state.teams[state.userTeam];
  let rows="";
  for(let w=0;w<REG_WEEKS;w++){
    const g=state.schedule[w].find(g=>g.h===state.userTeam||g.v===state.userTeam);
    if(!g){rows+=`<tr><td>W${w+1}</td><td colspan="2" class="muted">Bye</td></tr>`;continue;}
    const home=g.h===state.userTeam, opp=home?g.v:g.h;
    const res=u.results.find(r=>r.week===w+1);
    rows+=`<tr ${res&&res.us>res.them?'class="hl"':""}><td>W${w+1}</td>
      <td>${home?"vs":"at"} ${esc(SCHOOLS[opp].n)} ${esc(SCHOOLS[opp].m)}${g.riv?` <span class="rivtag">${IC("swords",11,"margin-right:3px")}${T("RIVALRY")}</span>`:g.conf?' <span class="muted">(conf)</span>':""}</td>
      <td>${res?`<b style="color:${res.us>res.them?"var(--good)":"var(--bad)"}">${res.us>res.them?"W":"L"} ${res.us}–${res.them}</b>`:'<span class="muted">—</span>'}</td></tr>`;
  }
  let post="";
  const fmt=g=>`${esc(SCHOOLS[g.winner].n)} def. ${esc(SCHOOLS[g.winner===g.h?g.v:g.h].n)} ${Math.max(g.sh,g.sv)}–${Math.min(g.sh,g.sv)}`;
  if(state.post.confGames.length) post+=`<div class="card"><h3>${T("Conference Championships")}</h3>${state.post.confGames.map(g=>`<div class="scoreline"><span>${fmt(g)}</span></div>`).join("")}</div>`;
  if(state.post.semis.length) post+=`<div class="card"><h3>${T("Playoff Semifinals")}</h3>${state.post.semis.map(g=>`<div class="scoreline"><span>${fmt(g)}</span></div>`).join("")}</div>`;
  if(state.post.final) post+=`<div class="card"><h3>${T("{ic:trophy} National Championship")}</h3><div class="scoreline"><span><b>${fmt(state.post.final)}</b></span></div></div>`;
  return `<div class="grid2"><div class="card"><h3>${state.season} ${T("Schedule")}</h3><table>${rows}</table></div><div>${post||`<div class="card"><h3>${T("Postseason")}</h3><div class="muted">${T("Conference title games, then a 4-team playoff of the conference champions.")}</div></div>`}</div></div>`;
}

function renderStats(){
  const all=[];
  for(const t of state.teams) for(const p of t.players) if(p.st.gp) all.push({p,t});
  const table=(title,key,fmt)=>{
    const top=all.slice().sort((a,b)=>b.p.st[key]-a.p.st[key]).slice(0,8);

let recFilter={pos:"ALL",show:"board"};
function setRecFilter(k,v){recFilter[k]=v; render();}
function toggleTarget(id){
  const rec=state.recruits.find(r=>r.id===id);
  if(!rec||rec.committed!==null) return;
  if(!rec.targeted&&state.recruits.filter(r=>r.targeted&&!r.committed).length>=8){
    alert("You can only actively recruit 8 targets at a time. Drop someone first."); return;
  }
  rec.targeted=!rec.targeted; save(); render();
}

  const targets=state.recruits.filter(r=>r.targeted&&!r.committed);

    if(recFilter.pos!=="ALL"&&r.pos!==recFilter.pos)return false;

      <select onchange="setRecFilter('show',this.value)">

  </div>`;

function setBudget(k,v){
  v=+v;
  const keys=["fac","rec","nil"].filter(x=>x!==k);
  const rest=100-v;
  const cur=state.budget[keys[0]]+state.budget[keys[1]];
  if(cur>0) state.budget[keys[0]]=Math.round(rest*state.budget[keys[0]]/cur);
  else state.budget[keys[0]]=Math.round(rest/2);
  state.budget[keys[1]]=rest-state.budget[keys[0]];
  state.budget[k]=v;
  save(); render();
}

      ${chk("injury",T("a starter gets injured"))}
      ${chk("rivalry",T("rivalry week comes up"))}
      ${chk("playoff",T("we reach a postseason game"))}
      <label class="chkrow" style="margin-top:10px"><input type="checkbox" ${state.recapOn!==false?"checked":""} onchange="toggleRecap()"> ${T("Show the weekly recap screen")}</label>
    </div>
    <div class="card"><h3>${T("Language & saves")}</h3>
      <div style="display:flex;gap:6px;margin-bottom:14px">
        ${[["en","English"],["fr","Français"]].map(([k,l])=>`<button class="btn-sm ${uiLang===k?"active":""}" onclick="setLang('${k}')">${l}</button>`).join("")}
      </div>
      <div class="muted" style="font-size:13px;margin-bottom:10px">
        ${T("Your career is stored in this browser. Export it to keep a backup or move to another device.")}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-sm" onclick="exportSave()">${IC("down",14,"margin-right:5px")}${T("Export career")}</button>
        <button class="btn-sm" onclick="document.getElementById('impf2').click()">${IC("up",14,"margin-right:5px")}${T("Import career")}</button>
        <input id="impf2" type="file" accept="application/json,.json" style="display:none" onchange="importSave(this)">
        <button class="btn-sm" onclick="backToHome()">${T("Switch career")}</button>
      </div>
      <div class="muted" style="font-size:12px;margin-top:8px">${T("Importing replaces the career in this slot.")}</div>
    </div>
  </div>`;
}

function renderHist(){
  const c=state.career;
  const careerCard=`<div class="card"><h3>Coaching Career — reputation ${coachRep()}/99</h3>
    <div style="font-size:15px;margin-bottom:8px"><b>${c.wins}-${c.losses}</b> over ${c.seasons} season${c.seasons!==1?"s":""} · ${c.confTitles} conference title${c.confTitles!==1?"s":""} · ${c.natTitles} national title${c.natTitles!==1?"s":""}</div>
    <div class="muted" style="font-size:13px">Stops: ${c.stops.map(s=>`${esc(SCHOOLS[s.team].n)} (${s.season}–)`).join(" → ")}</div>
    <div class="muted" style="font-size:13px;margin-top:6px">Win big and bigger programs will come calling in the offseason. Get fired and you'll be rebuilding somewhere small.</div>
  </div>`;
  // L2-4 achievements
  const got=Object.keys(state.achv||{}).length;
  const achvCard=`<div class="card"><h3>Achievements — ${got}/${ACHIEVEMENTS.length}</h3>
    <div class="achv">${ACHIEVEMENTS.map(a=>{
      const e=(state.achv||{})[a.id];
      return `<div class="ach ${e?"got":"locked"}">
        <div class="a-i" style="color:var(--accent)">${e?IC(ACH_ICON[a.id]||"star",21):IC("lock",19,"opacity:.7")}</div>
        <div class="a-n">${esc(T(a.n))}</div>
        <div class="a-d">${esc(T(a.d))}</div>
        ${e?`<div class="a-w">${T("Unlocked")} ${e.season}</div>`:""}
      </div>`;}).join("")}</div></div>`;
  // L2-2 records
  ensureRecords();
  const prog=state.records.prog[state.userTeam]||blankRecords();
  const recRow=(o,c)=>o&&o[c.k]
    ? `<div class="rec-row"><span>${esc(T(c.n))}</span>
        <span style="text-align:right"><span class="r-h">${esc(c.fmt(o[c.k].v))}</span><br>
        <span class="r-w">${esc(o[c.k].name)} · ${esc(SCHOOLS[o[c.k].team].n)} ${o[c.k].season}</span></span></div>`
    : `<div class="rec-row"><span>${esc(T(c.n))}</span><span class="muted">—</span></div>`;
  const recCard=`<div class="grid2">
    <div class="card"><h3>Program Records — ${esc(SCHOOLS[state.userTeam].n)}</h3>${REC_CATS.map(c=>recRow(prog,c)).join("")}</div>
    <div class="card"><h3>${T("National Records")}</h3>${REC_CATS.map(c=>recRow(state.records.nat,c)).join("")}</div>
  </div>`;
  // L2-3 hall of fame
  const hof=state.hof||[];
  const hofCard=`<div class="card"><h3>Hall of Fame — ${hof.length} inductee${hof.length!==1?"s":""}</h3>
    ${hof.length?`<div class="cardsgrid">${hof.slice().reverse().slice(0,12).map(h=>
        `<div style="cursor:pointer" onclick="openPlayer('${h.card.id}')">${playerCard(h.card,h.team,`${h.seasons} season${h.seasons!==1?"s":""} · class of ${h.season}`)}</div>`).join("")}</div>`
      :'<div class="muted">Your best players enter here when they graduate — 85+ overall, a national award, or huge career numbers.</div>'}</div>`;
  if(!state.history.length) return careerCard+achvCard+recCard+hofCard+`<div class="card"><h3>${T("Record Book")}</h3><div class="muted">Finish your first season to start the record book.</div></div>`;
  const titles=state.history.filter(h=>h.confChamp||h.natChamp);
  const trophyCase=titles.length?`<div class="card"><h3>${T("Trophy Case")}</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">
    ${titles.slice().reverse().map(h=>`<div class="champcard">
      <div style="font-size:26px;line-height:1">${h.natChamp?IC("trophy",26):IC("medal",26)}</div>
      <div style="font-weight:800;font-size:15px;margin-top:4px">${h.natChamp?"National Champions":"Conference Champions"}</div>
      <div class="muted" style="font-size:13px">${esc(SCHOOLS[h.team!==undefined?h.team:state.userTeam].n)} · ${h.season}</div>
      <div class="muted" style="font-size:13px;margin-top:2px">${h.userW}–${h.userL}</div>
    </div>`).join("")}</div></div>`:"";
  return careerCard+trophyCase+achvCard+recCard+hofCard+`<div class="card"><h3>${T("Record Book")}</h3>
  ${state.history.slice().reverse().map(h=>`
    <div style="border-bottom:1px solid var(--line);padding:10px 0">
      <b>${h.season}</b> — ${h.team!==undefined?esc(SCHOOLS[h.team].n)+" ":""}went ${h.userW}-${h.userL} ${h.natChamp?'<span class="tag g">{ic:trophy} National Champs</span>':h.confChamp?'<span class="tag y">{ic:medal} Conf Champs</span>':""}
      · National Champion: <b>${h.champ!==null?esc(SCHOOLS[h.champ].n):"—"}</b>
      ${h.awards?`<div class="muted" style="font-size:13px;margin-top:4px">POY: ${esc(h.awards.poy)}<br>DPOY: ${esc(h.awards.dpoy)}<br>Coach of the Year: ${esc(h.awards.coy)}</div>`:""}
    </div>`).join("")}
  <div style="margin-top:14px"><button class="btn-sm" onclick="if(confirm('Delete save and start a new career?'))resetGame()">New career (delete save)</button></div></div>`;
}

/* boot */
function boot(){
  adoptLegacySave();
  let act=0;
  try{ act=parseInt(localStorage.getItem(ACTIVE_KEY)||"0",10)||0; }catch(e){}
  activeSlot=clamp(act,0,SLOTS-1);
  if(loadSlot(activeSlot)){
    if(state.lang) uiLang=state.lang; // a career remembers the language it was played in
  } else {
    // fall back to any slot that does hold a career
    for(let i=0;i<SLOTS;i++) if(loadSlot(i)){ if(state.lang) uiLang=state.lang; break; }
  }
  render();
}
boot();
