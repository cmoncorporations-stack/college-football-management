  return "Play "+(state.week===0?"Week 1":"Week "+(state.week+1))+" →";
}
function ovrColor(o){return o>=80?"#4caf7d":o>=70?"#a3c94c":o>=60?"#e0a325":"#e05656";}
function ovrCell(o){return `<span class="ovr" style="background:${ovrColor(o)}22;color:${ovrColor(o)}">${o}</span>`;}
function abbrev(i){return SCHOOLS[i].n.split(" ").map(w=>w[0]).join("").slice(0,3).toUpperCase();}

/* ===== collectible player cards ===== */
const SIL=`<svg viewBox="0 0 100 62" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="19" r="13.5" fill="currentColor"/><path d="M16 62c3-19 17-26 34-26s31 7 34 26z" fill="currentColor"/></svg>`;
function rarity(p){
  if(p.ovr>=85)return{k:"r-uni",l:"UNIQUE"};
  if(p.ovr>=78)return{k:"r-sr",l:"SUPER RARE"};
  if(p.ovr>=70)return{k:"r-rare",l:"RARE"};
  if(p.ovr>=60)return{k:"r-lim",l:"LIMITED"};
  return{k:"r-com",l:"COMMON"};
}
function jersey(p){
  const n=typeof p.id==="number"?p.id:parseInt(String(p.id).replace(/\D/g,""),10)||7;
  return (n*37)%98+1;
}
function playerCard(p,teamIdx,subOverride){
  const r=rarity(p);
  const st=p.st&&p.st.gp?statline(p):YEARS[p.year]==="FR"?"incoming season":"no games yet";
  const flags=`${p.inj>0?` · 🚑 out ${p.inj}w`:""}${p.rs?" · redshirt":""}`;
  return `<div class="pcard ${r.k}" title="${esc(p.name)} — ${r.l} · potential ${p.pot} · morale ${p.mor??70}">
    <div class="pc-num">#${jersey(p)}</div>
    <div class="pc-top"><span class="pc-pos">${p.pos}</span><span class="pc-rar">${r.l}</span></div>
    <div class="pc-fig">${SIL}</div>
    <div class="pc-name">${esc(p.name)}</div>
    <div class="pc-sub">${subOverride?esc(subOverride):`${YEARS[p.year]} · ${esc(SCHOOLS[teamIdx].n)}${flags}`}</div>
    <div class="pc-row">
      <div class="pc-ovr">${p.ovr}<span>OVR</span></div>
      <div class="pc-meta">POT ${p.pot}<br>MOR ${p.mor??70}</div>
    </div>
    <div class="pc-stat">${esc(st)}</div>
  </div>`;
}

function render(){
  if(!state){renderSelect(); return;}
  if(state.live){app.innerHTML=renderLive(); return;}
  const s=SCHOOLS[state.userTeam], u=state.teams[state.userTeam];
  const r=teamRating(u);
  const conf=state.confidence;
  const confCol=conf>=60?"var(--good)":conf>=30?"var(--accent)":"var(--bad)";
  const rk=userRank();
  document.documentElement.style.setProperty("--team",s.col);
  const NAV=[["dash","Dashboard","▦"],["roster","Roster","👥"],["sched","Schedule","🗓"],["stand","Standings","🏆"],["stats","Stats","📊"],["recruit","Recruiting","🎯"],["staff","Staff","🪪"],["strategy","Strategy","📖"],["budget","Budget","💰"],["hist","History","📜"]];
  const titles=Object.fromEntries(NAV.map(([k,l])=>[k,l]));
  const actions=state.fired
    ?`<button class="btn-advance" style="background:var(--bad);color:#fff" onclick="resetGame()">Start Over</button>`
    :(state.week===SIGN_WEEK
      ?`<button class="btn-advance" onclick="startNewSeason()">${advLabel()}</button>`
      :(pendingUserGame()
        ?`<button class="btn-sm" style="padding:11px 18px;font-size:14px" onclick="startLive()">🎧 Coach Game</button>
           <button class="btn-advance" onclick="advanceWeek()">Quick Sim →</button>`
        :`<button class="btn-advance" onclick="advanceWeek()">${advLabel()}</button>`));
  app.innerHTML=`
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="teambadge" style="background:${s.col}">${abbrev(state.userTeam)}</div>
        <div><div class="bn">${esc(s.n)}</div><div class="bm">${esc(s.m)} · ${CONFS[s.c].replace(" League","")}</div></div>
      </div>
      <div class="ctx">
        <div class="ctxrow"><span>Season</span><b>${state.season}</b></div>
        <div class="ctxrow"><span>Phase</span><b>${weekLabel()}</b></div>
        <div class="ctxrow"><span>Playbook</span><b>${OFF_SCHEMES[u.off].name}</b></div>
        <div class="ctxrow"><span>Defense</span><b>${DEF_SCHEMES[u.def].name}</b></div>
        <div class="ctxrow"><span>Coach rep</span><b>${coachRep()}/99</b></div>
      </div>
      <nav class="nav">${NAV.map(([k,l,i])=>`<a class="${state.tab===k?"on":""}" onclick="setTab('${k}')"><span class="ic">${i}</span>${l}</a>`).join("")}</nav>
      <div class="sidefoot">
        <div class="sf-l">Board confidence</div>
        <div class="meter"><div style="width:${conf}%;background:${confCol}"></div></div>
        <div class="sf-v" style="color:${confCol}">${conf}%${state.fired?" · FIRED":conf<30?" · hot seat":""}</div>
      </div>
    </aside>
    <main class="main">
      <div class="pagehead">
        <div>
          <h1>${titles[state.tab]}</h1>
          <div class="crumb">
            ${rk?`<span class="chip gold">#${rk}</span>`:'<span class="chip">NR</span>'}
            <span class="chip">${u.wins}–${u.losses}</span>
            <span class="chip">Off ${Math.round(r.off)}</span>
            <span class="chip">Def ${Math.round(r.def)}</span>
            <span class="chip">Prestige ${u.prestige}</span>
          </div>
        </div>
        <div class="actions">${actions}</div>
      </div>
      ${{dash:renderDash,roster:renderRoster,sched:renderSched,stand:renderStand,stats:renderStats,recruit:renderRecruit,staff:renderStaff,strategy:renderStrategy,budget:renderBudget,hist:renderHist}[state.tab]()}
    </main>
  </div>`;
}
function setTab(t){state.tab=t; render();}

function renderSelect(){
  let html=`<div class="selectwrap"><div class="bigmsg"><h2>🏈 Gridiron GM</h2>
  <p>A college football management sim — 32 programs, 4 conferences.<br>Hire your staff, install your playbooks, recruit, develop, survive the board.<br>Pick your program. Higher prestige means higher expectations.</p></div>`;
  for(let c=0;c<4;c++){
    html+=`<div class="confblock"><h2>${CONFS[c]}</h2><div class="teamgrid">`;
    SCHOOLS.forEach((sc,i)=>{ if(sc.c!==c)return;
      html+=`<div class="teamcard" onclick="newGame(${i})">
        <div class="teambadge" style="background:${sc.col}">${abbrev(i)}</div>
        <div style="flex:1;min-width:0">
          <div class="tn">${esc(sc.n)} ${esc(sc.m)}</div>
          <div class="tm">Prestige ${sc.p} · expects ~${expectedWins(sc.p)} wins</div>
          <div class="meter" style="margin-top:7px"><div style="width:${sc.p}%;background:linear-gradient(90deg,${sc.col},var(--accent))"></div></div>
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  }
  app.innerHTML=html+"</div>";
}

function nextOpponent(){
  if(state.week>=REG_WEEKS) return null;
  const g=state.schedule[state.week].find(g=>g.h===state.userTeam||g.v===state.userTeam);
  if(!g) return null;
  const home=g.h===state.userTeam;
  return {idx:home?g.v:g.h,home,conf:g.conf};
}
function renderLive(){
  const L=state.live;
  const H=state.teams[L.h],V=state.teams[L.v];
  const badge=i=>`<div class="teambadge" style="background:${SCHOOLS[i].col}">${abbrev(i)}</div>`;
  const q=L.done?"FINAL":(L.log[0]&&L.log[0].q==="OT"?"OT":"Q"+Math.min(4,Math.floor(L.i/(L.total/4))+1));
  const offIdx=L.done?null:liveOffenseIdx();
  const userOff=offIdx===state.userTeam;
  let panel;
  if(L.done){
    const won=(L.h===state.userTeam?L.sh>L.sv:L.sv>L.sh);
    panel=`<div class="card" style="text-align:center">
      <h3>${won?"🎉 VICTORY":"Defeat"}</h3>
      <div style="font-size:22px;font-weight:800;margin-bottom:12px">${esc(SCHOOLS[L.h].n)} ${L.sh} — ${L.sv} ${esc(SCHOOLS[L.v].n)}</div>
      <button class="btn-advance" onclick="liveFinish()">Continue →</button></div>`;
  } else if(userOff){
    panel=`<div class="card"><h3>Drive ${L.i+1}/${L.total} — YOUR BALL. Call the drive:</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${Object.entries(OFF_CALLS).map(([k,n])=>`<button class="btn-sm" style="padding:12px 18px;font-size:14px" onclick="liveCall('${k}')">${n}</button>`).join("")}
      </div>
      <div class="muted" style="font-size:13px;margin-top:10px">Their ${DEF_SCHEMES[state.teams[offIdx===L.h?L.v:L.h].def].name} will try to guess your call. Run beats coverage shells; passing beats stacked boxes; balance is safe.</div></div>`;
  } else {
    const O=state.teams[offIdx];
    panel=`<div class="card"><h3>Drive ${L.i+1}/${L.total} — THEIR BALL. Call your defense:</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${Object.entries(DEF_CALLS).map(([k,n])=>`<button class="btn-sm" style="padding:12px 18px;font-size:14px" onclick="liveCall('${k}')">${n}</button>`).join("")}
      </div>
      <div class="muted" style="font-size:13px;margin-top:10px">They run ${OFF_SCHEMES[O.off].name} (${Math.round(OFF_SCHEMES[O.off].pass*100)}% pass). Guess right to shut the drive down. The blitz forces chaos — turnovers or big plays.</div></div>`;
  }
  return `<div class="selectwrap" style="max-width:980px"><div class="topbar">
    ${badge(L.h)}
    <div class="topinfo"><div class="tname">${esc(SCHOOLS[L.h].n)} vs ${esc(SCHOOLS[L.v].n)}</div>
    <div class="tsub">${L.kind} · ${q}</div></div>
    <div class="topstats">
      <div class="stat"><div class="v">${L.sh}</div><div class="l">${abbrev(L.h)}</div></div>
      <div class="stat"><div class="v">${L.sv}</div><div class="l">${abbrev(L.v)}</div></div>
    </div>
    ${badge(L.v)}
    ${L.done?"":`<button class="btn-sm" onclick="liveSimRest()">Sim rest</button><button class="btn-sm danger" onclick="liveQuit()">Abandon</button>`}
  </div>
  ${panel}
  <div class="card"><h3>Drive Log</h3>
    ${L.log.map(d=>`<div class="boxline">
      <span><b style="color:var(--muted)">${d.q==="OT"?"OT":"Q"+d.q}</b> · ${abbrev(d.off)} ball${d.offCall?` <span class="muted">(${OFF_CALLS[d.offCall]||d.offCall} vs ${DEF_CALLS[d.defCall]||d.defCall})</span>`:""} — ${esc(d.desc)}</span>
      <span>${d.pts>0?`<b style="color:var(--good)">+${d.pts}</b> `:""}${d.sh}–${d.sv}</span>
    </div>`).join("")||'<div class="muted">Kickoff coming up…</div>'}
  </div></div>`;
}

function renderDash(){
  const u=state.teams[state.userTeam];
  let nextHtml="—";
  const no=nextOpponent();
  if(no){
    const O=state.teams[no.idx], or_=teamRating(O);
    nextHtml=`${no.home?"vs":"at"} <b>${esc(SCHOOLS[no.idx].n)} ${esc(SCHOOLS[no.idx].m)}</b>
      <span class="muted">(${O.wins}-${O.losses}, Off ${Math.round(or_.off)} / Def ${Math.round(or_.def)}${no.conf?", conference":""})</span>
      <div class="muted" style="font-size:13px;margin-top:6px">They run ${OFF_SCHEMES[O.off].name} / ${DEF_SCHEMES[O.def].name} — matchup vs your offense: <b>${MATCHUP[u.off][O.def]>=0?"+":""}${MATCHUP[u.off][O.def]} pts</b> · your gameplan: <b>${GAMEPLANS[state.gameplan].name}</b> (Strategy tab)</div>`;
  } else if(state.week===REG_WEEKS){
    const st=confStandings(SCHOOLS[state.userTeam].c);
    nextHtml=st[0]===state.userTeam||st[1]===state.userTeam?"<b>Conference Championship!</b>":"Season over — watching the championships from home.";
  } else if(state.week<SIGN_WEEK){
    nextHtml=state.post.champs.includes(state.userTeam)||state.post.semis.some(g=>g.winner===state.userTeam)?"<b>Playoffs!</b>":"Postseason in progress.";
  } else nextHtml="Offseason — sign transfers in the Recruiting tab, then start the new season.";
  const best=u.players.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,6);
  const conf=state.confidence;
  const injured=u.players.filter(p=>p.inj>0);
  const r=teamRating(u), rk=userRank();
  let streak=0,sw=null;
  for(let i=u.results.length-1;i>=0;i--){const w=u.results[i].us>u.results[i].them; if(sw===null){sw=w;streak=1;} else if(w===sw)streak++; else break;}
  const signed=state.recruits.filter(x=>x.committed===state.userTeam).length;
  const targets=state.recruits.filter(x=>x.targeted&&!x.committed).length;
  const tiles=`<div class="kpis">
    <div class="tile"><div class="l">Record</div><div class="v">${u.wins}–${u.losses}</div><div class="s">${sw===null?"no games yet":(sw?"won":"lost")+" last "+streak}</div></div>
    <div class="tile"><div class="l">National Rank</div><div class="v">${rk?"#"+rk:"NR"}</div><div class="s">${rk?"Top 25 power poll":"outside the Top 25"}</div></div>
    <div class="tile"><div class="l">Team Rating</div><div class="v">${Math.round(r.ovr)}</div><div class="s">Off ${Math.round(r.off)} · Def ${Math.round(r.def)}</div></div>
    <div class="tile"><div class="l">Prestige</div><div class="v">${u.prestige}</div><div class="s">board expects ~${expectedWins(u.prestige)} wins</div></div>
    <div class="tile"><div class="l">Recruiting Class</div><div class="v">${signed}/10</div><div class="s">${targets} active target${targets!==1?"s":""}</div></div>
    <div class="tile"><div class="l">Board</div><div class="v" style="color:${conf>=60?"var(--good)":conf>=30?"var(--accent)":"var(--bad)"}">${conf}%</div><div class="s">${state.fired?"fired":conf<30?"hot seat":conf<60?"under watch":"secure"}</div></div>
  </div>`;
  const formHtml=u.results.length?`<div class="card"><h3>Season Form — margin by week</h3>
    <div class="form">${u.results.map(res=>{
      const m=res.us-res.them, h=clamp(Math.abs(m)*1.6,4,40);
      return `<div class="fcol" title="Wk ${res.week} ${res.home?"vs":"at"} ${SCHOOLS[res.opp].n}: ${res.us}–${res.them}">
        <div class="fup">${m>0?`<div class="fbar w" style="height:${h}px"></div>`:""}</div>
        <div class="fdn">${m<0?`<div class="fbar l" style="height:${h}px"></div>`:""}</div></div>`;}).join("")}
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px">Wins rise above the line, losses fall below · bar length = margin · hover for the score</div></div>`:"";
  let boxHtml="";
  if(state.lastBox){
    const b=state.lastBox;
    boxHtml=`<div class="card"><h3>Last Game — ${b.us>b.them?"W":"L"} ${b.us}–${b.them} ${b.home?"vs":"at"} ${esc(SCHOOLS[b.opp].n)}</h3>
      ${b.usLines.map(l=>`<div class="boxline"><span>${esc(l)}</span></div>`).join("")}
      <div class="muted" style="font-size:12px;margin-top:6px">${esc(SCHOOLS[b.opp].n)}: ${b.oppLines.map(esc).join(" · ")||"—"}</div></div>`;
  }
  let offersHtml="";
  if(state.week===SIGN_WEEK&&state.offers.length){
    offersHtml=`<div class="card" style="border-color:var(--accent)"><h3>📞 Head-Coaching Offers${state.fired?" — your way back in":""}</h3>
    ${state.offers.map(id=>{const t=state.teams[id];
      return `<div class="coachcard"><div>
        <div class="cn">${esc(SCHOOLS[id].n)} ${esc(SCHOOLS[id].m)}</div>
        <div class="cd">${CONFS[SCHOOLS[id].c]} · prestige ${t.prestige} · went ${t.wins}-${t.losses} · expects ~${expectedWins(t.prestige)} wins</div></div>
        <button class="btn-sm" onclick="acceptOffer(${id})">Accept job</button></div>`;}).join("")}
    <div class="muted" style="font-size:13px">Your reputation: ${coachRep()}/99. Your coordinators move with you. Offers expire when the new season starts.</div></div>`;
  }
  const no2=nextOpponent();
  const nextCard=`<div class="card"><h3>Next Up</h3>
    <div style="display:flex;gap:14px;align-items:flex-start">
      ${no2?`<div class="teambadge" style="background:${SCHOOLS[no2.idx].col}">${abbrev(no2.idx)}</div>`:""}
      <div style="font-size:15px;min-width:0">${nextHtml}</div>
    </div></div>`;
  return `${tiles}
  <div class="gdash">
    <div>
      ${offersHtml}
      ${nextCard}
      ${formHtml}
      ${boxHtml}
      ${injured.length?`<div class="card"><h3>Injury Report</h3>${injured.map(p=>`<div class="boxline"><span>${p.pos} ${esc(p.name)}</span><span class="tag r">OUT ${p.inj} wk</span></div>`).join("")}</div>`:""}
    </div>
    <div>
      <div class="card"><h3>News Wire</h3>
        ${state.news.slice(0,14).map(n=>`<div class="newsitem"><span class="wk">Season ${n.season} · Week ${n.week}</span>${esc(n.txt)}</div>`).join("")||'<div class="muted">Nothing yet.</div>'}
      </div>
      <div class="card"><h3>Star Cards</h3>
        <div class="cardsgrid mini">${best.slice(0,4).map(p=>playerCard(p,state.userTeam)).join("")}</div>
        <div class="muted" style="font-size:12px;margin-top:8px">Your four highest-rated players. Full collection in the Roster tab.</div>
      </div>
    </div>
  </div>`;
}

let rosterSort={key:"ovr",dir:-1};
function sortRoster(key){
  if(rosterSort.key===key) rosterSort.dir*=-1; else rosterSort={key,dir:key==="name"?1:-1};
  render();
}
let rosterView="cards", rosterPos="ALL";
function setRosterView(v){rosterView=v; render();}
function setRosterPos(v){rosterPos=v; render();}
function renderRoster(){
  const u=state.teams[state.userTeam];
  const toggle=`<div class="filterbar">
    <button class="btn-sm ${rosterView==="cards"?"active":""}" onclick="setRosterView('cards')">🃏 Cards</button>
    <button class="btn-sm ${rosterView==="list"?"active":""}" onclick="setRosterView('list')">☰ List</button>
    ${rosterView==="cards"?`<select onchange="setRosterPos(this.value)">
      <option value="ALL">All positions</option>
      ${POS.map(p=>`<option ${rosterPos===p?"selected":""}>${p}</option>`).join("")}
    </select>
    <span class="muted" style="font-size:12.5px">Card rarity follows the player's rating — Common → Limited → Rare → Super Rare → Unique. Use List for sorting${state.week===0?" and redshirts":""}.</span>`:""}
  </div>`;
  if(rosterView==="cards"){
    const cards=u.players.filter(p=>rosterPos==="ALL"||p.pos===rosterPos)
      .sort((a,b)=>b.ovr-a.ovr)
      .map(p=>playerCard(p,state.userTeam)).join("");
    return `<div class="card"><h3>My Collection — ${u.players.length} players</h3>${toggle}
      <div class="cardsgrid">${cards}</div></div>`;
  }
  const {key,dir}=rosterSort;
  const rows=u.players.slice().sort((a,b)=>{
    const x=a[key],y=b[key];
    return (typeof x==="string"?x.localeCompare(y):x-y)*dir;
  });
  const starters=new Set(startersOf(u).map(p=>p.id));
  return `<div class="card"><h3>Roster (${u.players.length} players) — click headers to sort · ⭐ = current starter${state.week===0?" · redshirt up to 6 freshmen (they sit the season but develop faster and keep the year of eligibility)":""}</h3>
  ${toggle}
  <div style="overflow-x:auto"><table>
    <tr><th onclick="sortRoster('name')">Player</th><th onclick="sortRoster('pos')">Pos</th><th onclick="sortRoster('year')">Year</th><th class="num" onclick="sortRoster('ovr')">OVR</th><th class="num" onclick="sortRoster('pot')">Pot</th><th class="num" onclick="sortRoster('mor')">Morale</th><th>Status</th><th>Season</th>${state.week===0?"<th></th>":""}</tr>
    ${rows.map(p=>{
      const mor=p.mor??70;
      const morCol=mor>=65?"var(--good)":mor>=45?"var(--accent)":"var(--bad)";
      return `<tr>
      <td>${starters.has(p.id)?"⭐ ":""}${esc(p.name)}</td><td>${p.pos}</td><td>${YEARS[p.year]}${p.rs?' <span class="tag y">RS</span>':""}</td>
      <td class="num">${ovrCell(p.ovr)}</td><td class="num muted">${p.pot}</td>
      <td class="num" style="color:${morCol};font-weight:700">${mor}</td>
      <td>${p.inj>0?`<span class="tag r">OUT ${p.inj} wk</span>`:p.rs?'<span class="tag y">Redshirt</span>':'<span class="tag g">OK</span>'}</td>
      <td class="muted" style="font-size:13px">${p.st.gp?esc(statline(p)):"—"}</td>
      ${state.week===0?`<td>${p.year===0||p.rs?`<button class="btn-sm ${p.rs?"active":""}" onclick="toggleRedshirt(${p.id})">${p.rs?"Redshirted":"Redshirt"}</button>`:""}</td>`:""}</tr>`;}).join("")}
  </table></div></div>`;
}

function renderSched(){
  const u=state.teams[state.userTeam];
  let rows="";
  for(let w=0;w<REG_WEEKS;w++){
    const g=state.schedule[w].find(g=>g.h===state.userTeam||g.v===state.userTeam);
    if(!g){rows+=`<tr><td>W${w+1}</td><td colspan="2" class="muted">Bye</td></tr>`;continue;}
    const home=g.h===state.userTeam, opp=home?g.v:g.h;
    const res=u.results.find(r=>r.week===w+1);
    rows+=`<tr ${res&&res.us>res.them?'class="hl"':""}><td>W${w+1}</td>
      <td>${home?"vs":"at"} ${esc(SCHOOLS[opp].n)} ${esc(SCHOOLS[opp].m)}${g.conf?' <span class="muted">(conf)</span>':""}</td>
      <td>${res?`<b style="color:${res.us>res.them?"var(--good)":"var(--bad)"}">${res.us>res.them?"W":"L"} ${res.us}–${res.them}</b>`:'<span class="muted">—</span>'}</td></tr>`;
  }
  let post="";
  const fmt=g=>`${esc(SCHOOLS[g.winner].n)} def. ${esc(SCHOOLS[g.winner===g.h?g.v:g.h].n)} ${Math.max(g.sh,g.sv)}–${Math.min(g.sh,g.sv)}`;
  if(state.post.confGames.length) post+=`<div class="card"><h3>Conference Championships</h3>${state.post.confGames.map(g=>`<div class="scoreline"><span>${fmt(g)}</span></div>`).join("")}</div>`;
  if(state.post.semis.length) post+=`<div class="card"><h3>Playoff Semifinals</h3>${state.post.semis.map(g=>`<div class="scoreline"><span>${fmt(g)}</span></div>`).join("")}</div>`;
  if(state.post.final) post+=`<div class="card"><h3>🏆 National Championship</h3><div class="scoreline"><span><b>${fmt(state.post.final)}</b></span></div></div>`;
  return `<div class="grid2"><div class="card"><h3>${state.season} Schedule</h3><table>${rows}</table></div><div>${post||'<div class="card"><h3>Postseason</h3><div class="muted">Conference title games, then a 4-team playoff of the conference champions.</div></div>'}</div></div>`;
}

function renderStand(){
  const poll=top25();
  let html=`<div class="card"><h3>AP-style Top 25 (power poll)</h3><div style="columns:2;column-gap:24px">
    ${poll.map((id,i)=>{const t=state.teams[id];
      return `<div class="boxline" ${id===state.userTeam?'style="color:var(--accent);font-weight:700"':""}><span>#${i+1} ${esc(SCHOOLS[id].n)}</span><span>${t.wins}-${t.losses}</span></div>`;}).join("")}
  </div></div><div class="grid2">`;
  for(let c=0;c<4;c++){
    const st=confStandings(c);
    html+=`<div class="card"><h3>${CONFS[c]}</h3><table>
    <tr><th>Team</th><th class="num">Conf</th><th class="num">Overall</th><th class="num">Off/Def</th></tr>
    ${st.map(i=>{const t=state.teams[i];const r=teamRating(t);
      return `<tr ${i===state.userTeam?'class="hl"':""}><td>${esc(SCHOOLS[i].n)}${t.confChamp?" 🏅":""}${t.natChamp?" 🏆":""}</td><td class="num">${t.confW}-${t.confL}</td><td class="num">${t.wins}-${t.losses}</td><td class="num muted">${Math.round(r.off)}/${Math.round(r.def)}</td></tr>`;}).join("")}
    </table></div>`;
  }
  return html+"</div>";
}

function renderStats(){
  const all=[];
  for(const t of state.teams) for(const p of t.players) if(p.st.gp) all.push({p,t});
  const table=(title,key,fmt)=>{
    const top=all.slice().sort((a,b)=>b.p.st[key]-a.p.st[key]).slice(0,8);
    return `<div class="card"><h3>${title}</h3><table>
      ${top.map((x,i)=>`<tr ${x.t.id===state.userTeam?'class="hl"':""}><td class="muted">${i+1}</td><td>${esc(x.p.name)} <span class="muted">(${x.p.pos}, ${abbrev(x.t.id)})</span></td><td class="num"><b>${fmt(x.p.st)}</b></td></tr>`).join("")}
    </table></div>`;
  };
  const u=state.teams[state.userTeam];
  const leaders=u.players.filter(p=>p.st.gp).sort((a,b)=>(b.st.paYd+b.st.ruYd+b.st.reYd)-(a.st.paYd+a.st.ruYd+a.st.reYd)).slice(0,8);
  return `<div class="card"><h3>Our Season Leaders</h3><table>
      <tr><th>Player</th><th>Pos</th><th>Line</th></tr>
      ${leaders.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.pos}</td><td class="muted">${esc(statline(p))}</td></tr>`).join("")||'<tr><td colspan="3" class="muted">No games played yet.</td></tr>'}
    </table></div>
    <div class="grid3">
    ${table("Passing Yards","paYd",s=>s.paYd+" yds, "+s.paTD+" TD")}
    ${table("Rushing Yards","ruYd",s=>s.ruYd+" yds, "+s.ruTD+" TD")}
    ${table("Receiving Yards","reYd",s=>s.reYd+" yds, "+s.reTD+" TD")}
    ${table("Sacks","sk",s=>s.sk+" sacks")}
    ${table("Interceptions","dInt",s=>s.dInt+" INT")}
    ${table("Tackles","tkl",s=>s.tkl+" tkl")}
  </div>`;
}

let recFilter={pos:"ALL",show:"board"};
function setRecFilter(k,v){recFilter[k]=v; render();}
function toggleTarget(id){
  const rec=state.recruits.find(r=>r.id===id);
  if(!rec||rec.committed!==null) return;
  if(!rec.targeted&&state.recruits.filter(r=>r.targeted&&!r.committed).length>=8){
    alert("You can only actively recruit 8 targets at a time. Drop someone first."); return;
  }
  rec.targeted=!rec.targeted; save(); render();
}
function renderRecruit(){
  const targets=state.recruits.filter(r=>r.targeted&&!r.committed);
  const signed=state.recruits.filter(r=>r.committed===state.userTeam);
  const pool=state.recruits.filter(r=>{
    if(recFilter.pos!=="ALL"&&r.pos!==recFilter.pos)return false;
    if(recFilter.show==="board")return !r.committed;
    if(recFilter.show==="targets")return r.targeted&&!r.committed;
    return r.committed===state.userTeam;
  }).slice(0,50);
  const row=r=>{
    const lead=recruitLeader(r);
    const mine=r.interest[state.userTeam]||0;
    let status;
    if(r.committed===state.userTeam) status='<span class="tag g">SIGNED ✓</span>';
    else if(r.committed!==null) status=`<span class="tag r">→ ${esc(SCHOOLS[r.committed].n)}</span>`;
    else if(lead&&lead.team===state.userTeam) status='<span class="tag g">Leading</span>';
    else if(lead) status=`<span class="tag y">${esc(SCHOOLS[lead.team].n)} leads</span>`;
    else status='<span class="muted">Open</span>';
    return `<tr ${r.targeted&&!r.committed?'class="hl"':""}>
      <td><span class="stars">${"★".repeat(r.stars)}</span></td>
      <td>${esc(r.name)}</td><td>${r.pos}</td>
      <td class="num">${ovrCell(r.ovr)}</td><td class="num muted">${r.pot}</td>
      <td class="num">${Math.round(mine)}</td><td>${status}</td>
      <td>${r.committed===null?`<button class="btn-sm ${r.targeted?"active":""}" onclick="toggleTarget('${r.id}')">${r.targeted?"Targeted":"Target"}</button>`:""}</td></tr>`;
  };
  let portalHtml="";
  if(state.week===SIGN_WEEK&&state.portal.length){
    portalHtml=`<div class="card"><h3>Transfer Portal — ${state.portalPts} NIL points left</h3>
    <div style="overflow-x:auto"><table>
      <tr><th>Player</th><th>Pos</th><th>Yr</th><th class="num">OVR</th><th class="num">Pot</th><th>From</th><th class="num">Cost</th><th></th></tr>
      ${state.portal.slice(0,25).map(p=>`<tr>
        <td>${esc(p.name)}</td><td>${p.pos}</td><td>${YEARS[p.year]}</td>
        <td class="num">${ovrCell(p.ovr)}</td><td class="num muted">${p.pot}</td>
        <td class="muted">${esc(SCHOOLS[p.from].n)}</td><td class="num">${p.ask}</td>
        <td>${p.signed?'<span class="tag g">SIGNED ✓</span>':`<button class="btn-sm" ${p.ask>state.portalPts?"disabled":""} onclick="signPortal('${p.id}')">Sign</button>`}</td></tr>`).join("")}
    </table></div></div>`;
  }
  return portalHtml+`<div class="card">
    <h3>Recruiting — ${userWeeklyPoints()} pts/week split across ${targets.length}/8 targets · class: ${signed.length}/10 signed</h3>
    <div class="filterbar">
      <select onchange="setRecFilter('show',this.value)">
        <option value="board" ${recFilter.show==="board"?"selected":""}>Available recruits</option>
        <option value="targets" ${recFilter.show==="targets"?"selected":""}>My targets</option>
        <option value="signed" ${recFilter.show==="signed"?"selected":""}>My signings</option>
      </select>
      <select onchange="setRecFilter('pos',this.value)">
        <option value="ALL">All positions</option>
        ${POS.map(p=>`<option ${recFilter.pos===p?"selected":""}>${p}</option>`).join("")}
      </select>
      <span class="muted" style="font-size:13px">Interest builds weekly. Recruits start committing from week 8; everyone signs on Signing Day.</span>
    </div>
    ${recFilter.show==="signed"
      ?(pool.length
        ?`<div class="cardsgrid">${pool.map(r=>playerCard(
            {id:r.id,name:r.name,pos:r.pos,year:0,ovr:r.ovr,pot:r.pot,st:null,mor:75,inj:0,rs:false},
            state.userTeam,
            `${"★".repeat(r.stars)} recruit · joins in the offseason`)).join("")}</div>`
        :'<div class="muted">No signings yet — target recruits and build interest week by week.</div>')
      :`<div style="overflow-x:auto"><table>
      <tr><th></th><th>Name</th><th>Pos</th><th class="num">OVR</th><th class="num">Pot</th><th class="num">My pts</th><th>Status</th><th></th></tr>
      ${pool.map(row).join("")||'<tr><td colspan="8" class="muted">No recruits match this filter.</td></tr>'}
    </table></div>`}</div>`;
}

function renderStaff(){
  const used=salaryUsed(), pool=salaryPool();
  const u=state.teams[state.userTeam];
  const slot=role=>{
    const c=state.staff[role];
    return `<div class="coachcard">
      <div>
        <div class="cn">${ROLE_INFO[role].name}</div>
        ${c?`<div>${esc(c.name)} — rating <b style="color:${ovrColor(c.rating)}">${c.rating}</b>${c.spec?` · specialty: <b>${(role==="OC"?OFF_SCHEMES:DEF_SCHEMES)[c.spec].name}</b>${c.spec===(role==="OC"?u.off:u.def)?' <span class="tag g">fits playbook</span>':' <span class="tag y">scheme mismatch</span>'}`:""} · $${c.salary}M/yr</div>`
          :`<div class="tag r">VACANT — big penalty until filled</div>`}
        <div class="cd">${ROLE_INFO[role].eff}</div>
      </div>
      ${c?`<button class="btn-sm danger" onclick="fireCoach('${role}')">Fire</button>`:""}
    </div>`;
  };
  const market=role=>`<div class="card"><h3>${ROLE_INFO[role].name} candidates</h3>
    ${state.market[role].map(c=>`<div class="coachcard">
      <div><div class="cn">${esc(c.name)} — <span style="color:${ovrColor(c.rating)}">${c.rating}</span></div>
      <div class="cd">${c.spec?`Specialty: ${(role==="OC"?OFF_SCHEMES:DEF_SCHEMES)[c.spec].name} · `:""}$${c.salary}M/yr</div></div>
      <button class="btn-sm" onclick="hireCoach('${role}','${c.id}')">${state.staff[role]?"Replace":"Hire"}</button>
    </div>`).join("")}</div>`;
  return `<div class="card"><h3>Coaching Staff — salary pool $${used.toFixed(2)}M / $${pool.toFixed(1)}M (grows with prestige)</h3>
    ${STAFF_ROLES.map(slot).join("")}
    <div class="muted" style="font-size:13px">Coaches can be hired or replaced at any time. Good coordinators get poached by bigger programs in the offseason.</div>
  </div>
  <div class="grid2">${market("OC")}${market("DC")}${market("RC")}${market("SC")}</div>`;
}

function renderStrategy(){
  const u=state.teams[state.userTeam];
  const no=nextOpponent();
  const offCard=key=>{
    const s=OFF_SCHEMES[key];
    const fit=Math.round(
      avg(topN(u.players,"QB",1))*s.w.QB+avg(topN(u.players,"RB",2))*s.w.RB+
      avg(topN(u.players,"WR",3))*s.w.WR+avg(topN(u.players,"OL",5))*s.w.OL);
    return `<div class="schemecard ${u.off===key?"sel":""}" onclick="setScheme('off','${key}')">
      <div class="sn">${s.name} <span>${ovrCell(fit)}</span></div>
      <div class="sd">${s.desc}</div>
      <div class="sd">Pass ${Math.round(s.pass*100)}% · Tempo ${s.tempo>1.02?"fast":s.tempo<0.95?"slow":"normal"} · leans on ${Object.entries(s.w).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).join(" + ")}</div>
    </div>`;
  };
  const defCard=key=>{
    const s=DEF_SCHEMES[key];
    const fit=Math.round(avg(topN(u.players,"DL",4))*s.w.DL+avg(topN(u.players,"LB",3))*s.w.LB+avg(topN(u.players,"DB",4))*s.w.DB);
    return `<div class="schemecard ${u.def===key?"sel":""}" onclick="setScheme('def','${key}')">
      <div class="sn">${s.name} <span>${ovrCell(fit)}</span></div>
      <div class="sd">${s.desc}</div>
      <div class="sd">Leans on ${Object.entries(s.w).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).join(" + ")}</div>
    </div>`;
  };
  let scout="";
  if(no){
    const O=state.teams[no.idx];
    const bestDef=Object.keys(DEF_SCHEMES).sort((a,b)=>MATCHUP[O.off][a]-MATCHUP[O.off][b])[0];
    scout=`<div class="card"><h3>Scouting Report — ${no.home?"vs":"at"} ${esc(SCHOOLS[no.idx].n)}</h3>
      <div style="font-size:14px">They run <b>${OFF_SCHEMES[O.off].name}</b> offense and <b>${DEF_SCHEMES[O.def].name}</b> defense.</div>
      <div class="muted" style="font-size:13px;margin-top:6px">
      Your ${OFF_SCHEMES[u.off].name} vs their ${DEF_SCHEMES[O.def].name}: <b>${MATCHUP[u.off][O.def]>=0?"+":""}${MATCHUP[u.off][O.def]} pts</b>.
      Their ${OFF_SCHEMES[O.off].name} vs your ${DEF_SCHEMES[u.def].name}: <b>${MATCHUP[O.off][u.def]>=0?"+":""}${MATCHUP[O.off][u.def]} pts</b> for them.
      Best defense against their offense: <b>${DEF_SCHEMES[bestDef].name}</b>. Mid-season playbook changes carry an install penalty.</div></div>`;
  }
  return `${scout}
  ${(state.installingOff||state.installingDef)?'<div class="card"><span class="tag y">INSTALLING</span> <span class="muted" style="font-size:13px">You changed playbooks mid-season — the unit takes a penalty until next season.</span></div>':""}
  <div class="card"><h3>Weekly Gameplan</h3>
    ${Object.entries(GAMEPLANS).map(([k,g])=>`<button class="btn-sm ${state.gameplan===k?"active":""}" style="margin-right:8px" onclick="setGameplan('${k}')">${g.name}</button>`).join("")}
    <div class="muted" style="font-size:13px;margin-top:10px">${GAMEPLANS[state.gameplan].desc}</div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Offensive Playbook — the number is your roster's talent fit</h3>${Object.keys(OFF_SCHEMES).map(offCard).join("")}</div>
    <div class="card"><h3>Defensive Playbook</h3>${Object.keys(DEF_SCHEMES).map(defCard).join("")}</div>
  </div>`;
}

function setBudget(k,v){
  v=+v;
  const keys=["fac","rec","nil"].filter(x=>x!==k);
  const rest=100-v;
  const cur=state.budget[keys[0]]+state.budget[keys[1]];
  if(cur>0) state.budget[keys[0]]=Math.round(rest*state.budget[keys[0]]/cur);
  else state.budget[keys[0]]=Math.round(rest/2);
  state.budget[keys[1]]=rest-state.budget[keys[0]];
  state.budget[k]=v;
  save(); render();
}
function renderBudget(){
  const b=state.budget;
  const row=(k,label,desc)=>`<div class="sliderrow">
    <label>${label}</label>
    <input type="range" min="0" max="100" value="${b[k]}" oninput="setBudget('${k}',this.value)">
    <span class="val">${b[k]}%</span></div>
    <div class="muted" style="margin:-8px 0 16px 122px;font-size:13px">${desc}</div>`;
  return `<div class="card"><h3>Program Budget — 100 points across three areas</h3>
    ${row("fac","Facilities","Boosts player development each offseason.")}
    ${row("rec","Recruiting","Adds weekly recruiting points on your targets.")}
    ${row("nil","NIL Fund","Extra pull with recruits, and funds your transfer-portal signings.")}
    <div class="muted" style="font-size:13px">Coach salaries come from a separate pool that grows with prestige (see Staff tab).</div>
  </div>`;
}

function renderHist(){
  const c=state.career;
  const careerCard=`<div class="card"><h3>Coaching Career — reputation ${coachRep()}/99</h3>
    <div style="font-size:15px;margin-bottom:8px"><b>${c.wins}-${c.losses}</b> over ${c.seasons} season${c.seasons!==1?"s":""} · ${c.confTitles} conference title${c.confTitles!==1?"s":""} · ${c.natTitles} national title${c.natTitles!==1?"s":""}</div>
    <div class="muted" style="font-size:13px">Stops: ${c.stops.map(s=>`${esc(SCHOOLS[s.team].n)} (${s.season}–)`).join(" → ")}</div>
    <div class="muted" style="font-size:13px;margin-top:6px">Win big and bigger programs will come calling in the offseason. Get fired and you'll be rebuilding somewhere small.</div>
  </div>`;
  if(!state.history.length) return careerCard+`<div class="card"><h3>Record Book</h3><div class="muted">Finish your first season to start the record book.</div></div>`;
  return careerCard+`<div class="card"><h3>Record Book</h3>
  ${state.history.slice().reverse().map(h=>`
    <div style="border-bottom:1px solid var(--line);padding:10px 0">
      <b>${h.season}</b> — ${h.team!==undefined?esc(SCHOOLS[h.team].n)+" ":""}went ${h.userW}-${h.userL} ${h.natChamp?'<span class="tag g">🏆 National Champs</span>':h.confChamp?'<span class="tag y">🏅 Conf Champs</span>':""}
      · National Champion: <b>${h.champ!==null?esc(SCHOOLS[h.champ].n):"—"}</b>
      ${h.awards?`<div class="muted" style="font-size:13px;margin-top:4px">POY: ${esc(h.awards.poy)}<br>DPOY: ${esc(h.awards.dpoy)}<br>Coach of the Year: ${esc(h.awards.coy)}</div>`:""}
    </div>`).join("")}
  <div style="margin-top:14px"><button class="btn-sm" onclick="if(confirm('Delete save and start a new career?'))resetGame()">New career (delete save)</button></div></div>`;
}

/* boot */
load(); render();
</script>
</body>
</html>
