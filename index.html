<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gridiron GM — College Football Manager</title>
<meta name="description" content="Take over a college football program: recruit, coach, and survive the board.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0d12">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gridiron GM">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    /* Palette taken from the Gridiron GM crest: navy structure, red banner, silver plate. */
    --bg:#070b13; --panel:#0f1626; --panel2:#17203a; --raise:#1e2949;
    --line:#232f4d; --line2:#33436e;
    --text:#eef1f7; --muted:#9aa7bf; --faint:#6d7996;
    --brand:#e01f2d; --brand-dk:#9d0f1a;      /* the red banner */
    --navy:#1b2a4a; --silver:#e8ecf3;         /* the plate and its border */
    --accent:#e8b73f;                          /* gold: ratings, trophies, highlights */
    --good:#3fb87f; --bad:#ff6b6b; --team:#1f4e79;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:14.5px; line-height:1.45;}
  h1{font-size:20px; font-weight:800; letter-spacing:-.01em;}
  h2,h3{font-weight:700;}
  button{font:inherit; cursor:pointer; border:none; border-radius:9px;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .num, td.num, .stat .v, .tile .v, .chip{font-variant-numeric:tabular-nums;}

  /* ===== app shell ===== */
  .shell{display:grid; grid-template-columns:238px minmax(0,1fr); min-height:100vh;}
  .side{position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:14px; padding:16px 14px 14px;
    border-right:1px solid var(--line2);
    background:linear-gradient(180deg, color-mix(in srgb, var(--team) 34%, #101a2e) 0%, #0d1524 42%, var(--panel) 100%);
    box-shadow:inset -1px 0 0 rgba(255,255,255,.05);}
  .brandmark{display:flex; justify-content:center; padding:2px 0 8px;}
  .gg-logo{display:block; height:auto; max-width:100%; margin:0 auto 4px;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.6));}
  .brand{display:flex; gap:10px; align-items:center; padding:0 4px;}
  .brand .bn{font-weight:800; font-size:15px; line-height:1.2;}
  .brand .bm{color:var(--muted); font-size:12px;}
  .ctx{background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; padding:8px 11px; font-size:12.5px;}
  .ctxrow{display:flex; justify-content:space-between; gap:8px; padding:3px 0; color:var(--muted);}
  .ctxrow b{color:var(--text); font-weight:700; text-align:right;}
  .nav{display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
  .nav a{display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:9px; color:var(--muted); font-weight:600; font-size:13.5px; cursor:pointer; border-left:3px solid transparent;}
  .nav a:hover{background:var(--panel2); color:var(--text);}
  .nav a.on{background:linear-gradient(90deg,rgba(224,31,45,.20),transparent); color:#fff; border-left-color:var(--brand);}
  .nav .ic{width:20px; text-align:center;}
  .sidefoot{border-top:1px solid var(--line); padding-top:12px; font-size:12px;}
  .sf-l{color:var(--faint); text-transform:uppercase; letter-spacing:.07em; font-size:10.5px; margin-bottom:6px;}
  .sf-v{margin-top:6px; font-weight:700;}

  .main{padding:20px 26px 48px; min-width:0; max-width:1280px;}
  .pagehead{display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;
    border-bottom:2px solid var(--line2); padding-bottom:12px; position:relative;}
  .pagehead::after{content:""; position:absolute; left:0; bottom:-2px; width:74px; height:2px; background:var(--brand);}
  .crumb{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
  .chip{display:inline-block; background:var(--panel2); border:1px solid var(--line2); color:#b9c4d8;
    border-radius:5px; padding:2px 10px; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;}
  .chip.gold{color:#fff; background:linear-gradient(180deg,#e8202c,#b5121d); border-color:#f0525c;}
  .actions{display:flex; gap:8px; flex-wrap:wrap;}

  /* ===== KPI tiles ===== */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(152px,1fr)); gap:10px; margin-bottom:14px;}
  .tile{background:linear-gradient(180deg,#16213a,var(--panel)); border:1px solid var(--line);
    border-radius:11px; padding:12px 14px; border-top:2px solid var(--line2);}
  .tile .l{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.07em; margin-bottom:4px;}
  .tile .v{font-size:22px; font-weight:800; line-height:1.1;}
  .tile .s{font-size:12px; color:var(--muted); margin-top:3px;}

  /* ===== season form chart ===== */
  .form{display:flex; gap:5px; align-items:stretch; height:98px; padding:4px 2px;}
  .fcol{flex:1; display:flex; flex-direction:column; min-width:10px; max-width:28px; cursor:default;}
  .fup{flex:1; display:flex; align-items:flex-end; justify-content:center; border-bottom:1px solid var(--line2);}
  .fdn{flex:1; display:flex; align-items:flex-start; justify-content:center;}
  .fbar{width:72%; border-radius:3px;}
  .fbar.w{background:var(--good);}
  .fbar.l{background:var(--bad);}

  /* ===== live-game bar ===== */
  .topbar{display:flex; align-items:center; gap:16px; background:linear-gradient(180deg,#16213a,#0d1524);
    border:1px solid var(--line2); border-top:3px solid var(--brand); border-radius:12px;
    padding:14px 18px; margin-bottom:14px; flex-wrap:wrap;}
  .teambadge{width:46px; height:46px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; color:#fff; flex:none; box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);}
  .topinfo{flex:1; min-width:200px;}
  .topinfo .tname{font-size:18px; font-weight:800;}
  .topinfo .tsub{color:var(--muted); font-size:13px;}
  .topstats{display:flex; gap:20px; align-items:center; flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat .v{font-size:22px; font-weight:800;}
  .stat .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  .btn-advance{background:linear-gradient(180deg,#e8202c,#b5121d); color:#fff; font-weight:800; padding:11px 20px;
    font-size:14.5px; box-shadow:0 2px 10px rgba(224,31,45,.32); border:1px solid #f0525c;
    font-family:"Barlow Condensed",Arial Narrow,sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:16px;}
  .btn-advance:hover{filter:brightness(1.08);}
  .btn-sm{background:var(--panel2); color:var(--text); border:1px solid var(--line2); padding:6px 12px; font-size:13px;}
  .btn-sm:hover:not(:disabled){border-color:var(--accent);}
  .btn-sm.active{background:linear-gradient(180deg,#e8202c,#b5121d); color:#fff; border-color:#f0525c; font-weight:700;}
  .btn-sm.danger{color:var(--bad); border-color:rgba(224,93,93,.4);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  .gdash{display:grid; grid-template-columns:1.45fr 1fr; gap:14px;}
  .card{background:linear-gradient(180deg,#131d31,var(--panel)); border:1px solid var(--line);
    border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 1px 0 rgba(255,255,255,.04) inset;}
  .card h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin-bottom:12px; font-weight:700;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{color:var(--faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; text-align:left; padding:6px 8px; border-bottom:1px solid var(--line2); cursor:pointer; white-space:nowrap;}
  td{padding:8px; border-bottom:1px solid rgba(35,45,58,.55); white-space:nowrap;}
  tr:has(td):hover td{background:rgba(230,178,61,.05);}
  tr.hl td{background:color-mix(in srgb, var(--accent) 9%, transparent);}
  .num{text-align:right;}
  .ovr{display:inline-block; min-width:30px; text-align:center; padding:2px 5px; border-radius:6px; font-weight:700; font-size:12.5px;}
  .stars{color:var(--accent); letter-spacing:1px;}

  .newsitem{padding:8px 0 8px 12px; border-bottom:1px solid rgba(35,45,58,.55); border-left:2px solid var(--line2); margin-left:2px; font-size:13.5px;}
  .newsitem .wk{display:block; color:var(--faint); font-size:11px; margin-bottom:1px;}

  .meter{height:9px; background:var(--panel2); border-radius:5px; overflow:hidden; margin-top:4px;}
  .meter div{height:100%; border-radius:5px;}

  /* ===== team select ===== */
  .selectwrap{max-width:1180px; margin:0 auto; padding:24px 20px;}
  .confblock{margin-bottom:24px;}
  .confblock h2{font-size:15px; color:#fff; text-transform:uppercase; letter-spacing:.09em; margin-bottom:10px;
    font-family:"Barlow Condensed",Arial Narrow,sans-serif; font-weight:800;
    border-left:4px solid var(--brand); padding-left:10px;}
  .teamgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px;}
  .teamcard{background:linear-gradient(180deg,#141f36,var(--panel)); border:1px solid var(--line);
    border-radius:11px; padding:13px; display:flex; gap:12px; align-items:center; cursor:pointer;
    transition:border-color .15s, transform .1s, box-shadow .15s;}
  .teamcard:hover{border-color:var(--brand); transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.45);}
  .teamcard .tn{font-weight:700; font-size:14px;}
  .teamcard .tm{color:var(--muted); font-size:12px;}

  .sliderrow{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .sliderrow label{width:110px; font-weight:600; font-size:14px;}
  .sliderrow input{flex:1;}
  .sliderrow .val{width:44px; text-align:right; font-weight:700;}
  input[type=range]{accent-color:var(--accent);}

  .bigmsg{text-align:center; padding:44px 20px 30px;}
  .bigmsg h2{font-size:30px; margin-bottom:10px; letter-spacing:-.02em;}
  .bigmsg p{color:var(--muted); margin-bottom:20px;}
  .muted{color:var(--muted);}
  .tag{display:inline-block; padding:2px 8px; border-radius:6px; font-size:11.5px; font-weight:700;}
  .tag.g{background:rgba(65,184,131,.14); color:var(--good);}
  .tag.r{background:rgba(224,93,93,.14); color:var(--bad);}
  .tag.y{background:rgba(230,178,61,.14); color:var(--accent);}
  .scoreline{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(35,45,58,.55); font-size:14px;}
  .filterbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center;}
  select{background:var(--panel2); color:var(--text); border:1px solid var(--line2); border-radius:8px; padding:6px 10px; font:inherit; font-size:13px;}

  .schemecard{background:var(--panel2); border:2px solid var(--line); border-radius:11px; padding:12px; cursor:pointer; margin-bottom:10px;}
  .schemecard:hover{border-color:var(--muted);}
  .schemecard.sel{border-color:var(--accent);}
  .schemecard .sn{font-weight:800; display:flex; justify-content:space-between; align-items:center;}
  .schemecard .sd{color:var(--muted); font-size:13px; margin-top:4px;}
  .coachcard{background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .coachcard .cn{font-weight:700;}
  .coachcard .cd{color:var(--muted); font-size:13px;}
  .boxline{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:3px 0;}

  /* ===== icons ===== */
  .ic-svg{vertical-align:-.16em; flex:none;}
  .ic-lead{margin-right:7px;}
  .nav .ic{width:22px; display:flex; align-items:center; justify-content:center;}

  /* ===== ESPN-style banner heads ===== */
  .banner{display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,#e8202c,#b5121d);
    color:#fff; border-radius:9px 9px 0 0; padding:8px 14px; margin:-16px -16px 14px;
    font-family:"Barlow Condensed",Arial Narrow,sans-serif; font-weight:800; font-size:15px;
    text-transform:uppercase; letter-spacing:.06em;}
  .card h3{text-transform:uppercase; letter-spacing:.09em; color:#b9c4d8; margin-bottom:12px;
    font-weight:800; font-family:"Barlow Condensed",Arial Narrow,sans-serif; font-size:15px;
    display:flex; align-items:center; gap:7px; padding-bottom:7px; border-bottom:1px solid var(--line);}
  h1{font-family:"Barlow Condensed",Arial Narrow,sans-serif; font-weight:800; letter-spacing:.01em;
    text-transform:uppercase; font-size:26px;}
  .stat .v,.tile .v,.bscore,.pc-ovr{font-family:"Barlow Condensed",Arial Narrow,sans-serif;}
  .brand .bn{font-family:"Barlow Condensed",Arial Narrow,sans-serif; font-weight:800; font-size:17px;
    text-transform:uppercase; letter-spacing:.02em;}
  .crest{display:block; filter:drop-shadow(0 2px 4px rgba(0,0,0,.55));}

  /* ===== Topps-style chrome cards ===== */
  .cardsgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:13px;}
  .cardsgrid.mini{grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px;}
  .tcard{position:relative; border-radius:12px; padding:5px; aspect-ratio:2.5/3.5;
    background:
      linear-gradient(115deg,#fff 0%,#c8cdd6 14%,#8e959f 27%,#eef1f5 38%,#9aa2ad 52%,#e7eaef 66%,#7f8792 80%,#f4f6f9 100%);
    box-shadow:0 5px 16px rgba(0,0,0,.5); transition:transform .18s ease, box-shadow .18s ease;}
  .tcard:hover{transform:translateY(-5px) scale(1.015); box-shadow:0 16px 34px rgba(0,0,0,.6), 0 0 22px -6px var(--rfg);}
  .tcard{--rfg:#aeb6c2; --rf1:#e8edf4; --rf2:#93a0b3;}
  .tcard.r-lim{--rfg:#5e96e7; --rf1:#dce9ff; --rf2:#2f66b0;
    background:linear-gradient(115deg,#eaf2ff,#8fb4ea 16%,#4d7fc4 30%,#dbe8fb 42%,#5e96e7 58%,#e8f1ff 72%,#4a76b8 86%,#eaf2ff);}
  .tcard.r-rare{--rfg:#e8894a; --rf1:#ffe2cc; --rf2:#b2551f;
    background:linear-gradient(115deg,#fff0e2,#f0a86e 16%,#c26a2a 30%,#ffe6d2 42%,#e8894a 58%,#fff1e4 72%,#b45f22 86%,#fff0e2);}
  .tcard.r-sr{--rfg:#e6b23d; --rf1:#fff3cf; --rf2:#9e751a;
    background:linear-gradient(115deg,#fffaea,#f0d183 14%,#b6902f 28%,#fff6dc 40%,#e6b23d 56%,#fffaec 70%,#a8801f 86%,#fffaea);}
  .tcard.r-uni{--rfg:#d94fd0; --rf1:#ffe9fb; --rf2:#6a3fc0;
    background:linear-gradient(115deg,#fff2fb,#ffd166 12%,#5ee7a8 26%,#59b7ff 40%,#c56bff 54%,#ff6ba6 68%,#ffd166 82%,#fff2fb);}
  .tc-frame{position:relative; height:100%; border-radius:9px; overflow:hidden;
    background:linear-gradient(180deg,#151b23,#0a0e13); display:flex; flex-direction:column;}
  .tc-photo{position:relative; flex:1; min-height:0; overflow:hidden;
    background:radial-gradient(120% 80% at 50% 8%, color-mix(in srgb, var(--rfg) 26%, #10161d) 0%, #0b1016 72%);}
  .tc-photo::before{content:""; position:absolute; left:-10%; right:-10%; bottom:0; height:34%;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 26px),
      linear-gradient(180deg,#1d3b28 0%,#16301f 60%,#0d1a12 100%);
    transform:perspective(120px) rotateX(38deg); transform-origin:bottom; pointer-events:none;}
  .tc-photo::after{content:""; position:absolute; left:0; right:0; bottom:0; height:42%;
    background:linear-gradient(180deg,transparent,#0b1016 88%); pointer-events:none;}
  .tc-photo .glow{position:absolute; top:-14%; left:50%; width:110%; height:60%; transform:translateX(-50%);
    background:radial-gradient(50% 60% at 50% 50%, color-mix(in srgb, var(--rfg) 40%, transparent), transparent 70%);
    pointer-events:none;}
  .tc-fig{position:absolute; left:0; right:0; bottom:-1%; width:100%; height:94%; z-index:1;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));}
  .tc-shine{position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(104deg,transparent 34%,rgba(255,255,255,.16) 46%,rgba(255,255,255,.03) 52%,transparent 62%);}
  .tc-rar{position:absolute; top:6px; left:7px; z-index:2; font-family:"IBM Plex Mono",monospace;
    font-size:6.5px; letter-spacing:.1em; font-weight:700; color:var(--rf1);
    background:rgba(0,0,0,.55); border:1px solid var(--rf2); border-radius:4px; padding:2px 5px;}
  .tc-ovr{position:absolute; top:5px; right:7px; z-index:2;
    font-family:"Barlow Condensed",Arial Narrow,sans-serif; font-weight:800; font-size:27px; line-height:1;
    color:#fff; text-shadow:0 2px 5px #000, 0 0 12px var(--rfg);}
  .tc-plate{position:relative; z-index:2; display:flex; align-items:center; gap:7px; padding:5px 8px;
    background:linear-gradient(90deg,var(--rf2),#0d1219 78%); border-top:1px solid var(--rf1);}
  .tc-crest{flex:none; display:flex;}
  .tc-txt{min-width:0; flex:1;}
  .tc-name{display:block; font-family:"Barlow Condensed",Arial Narrow,sans-serif; font-weight:800;
    font-size:14.5px; text-transform:uppercase; letter-spacing:.02em; line-height:1.05; color:#fff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tc-sub{display:block; font-size:8.5px; color:#cdd6e2; text-transform:uppercase; letter-spacing:.04em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tc-sub b{color:var(--rf1);}
  .tc-foot{display:flex; justify-content:space-between; gap:6px; padding:3px 8px 4px; background:#080b10;
    font-family:"IBM Plex Mono",monospace; font-size:8px; color:var(--muted);
    white-space:nowrap; overflow:hidden;}
  .tc-foot span:last-child{overflow:hidden; text-overflow:ellipsis;}
  .pcard{position:relative; aspect-ratio:63/88; border-radius:16px; padding:11px 11px 9px; overflow:hidden;
    background:radial-gradient(130% 95% at 50% -12%, var(--tint) 0%, transparent 55%), linear-gradient(165deg,#1b232e 0%,#0b0f14 72%);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    transition:transform .18s ease, box-shadow .18s ease;
    display:flex; flex-direction:column;}
  .pcard::before{content:""; position:absolute; inset:0; border-radius:16px; padding:2px; background:var(--frame);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;}
  .pcard::after{content:""; position:absolute; top:-80%; left:-90%; width:55%; height:260%; transform:rotate(25deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.11),transparent); pointer-events:none; transition:left .55s ease;}
  .pcard:hover{transform:translateY(-5px) scale(1.02); box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 26px -6px var(--glow);}
  .pcard:hover::after{left:140%;}
  .r-uni {--frame:linear-gradient(140deg,#f8e08e,#a97e1c 42%,#fff3c4 58%,#8a6d1d); --tint:rgba(231,197,94,.30); --glow:rgba(231,197,94,.6);  --rlab:#f1d47c;}
  .r-sr  {--frame:linear-gradient(140deg,#9cc4f5,#2f66b0 42%,#d6e7ff 58%,#1c3f6e); --tint:rgba(94,150,231,.28);  --glow:rgba(94,150,231,.55); --rlab:#9cc4f5;}
  .r-rare{--frame:linear-gradient(140deg,#f0908a,#a3272c 42%,#ffd9d1 58%,#6e1c22); --tint:rgba(224,93,93,.26);   --glow:rgba(224,93,93,.55);  --rlab:#f0908a;}
  .r-lim {--frame:linear-gradient(140deg,#f3cf7d,#b98a1f 42%,#fff0c8 58%,#7c5c14); --tint:rgba(230,178,61,.22);  --glow:rgba(230,178,61,.5);  --rlab:#f3cf7d;}
  .r-com {--frame:linear-gradient(140deg,#7e8b9d,#414c5c 42%,#c7d1de 58%,#333d4b); --tint:rgba(139,151,168,.16); --glow:rgba(139,151,168,.35);--rlab:#aab6c5;}
  .pc-top{display:flex; justify-content:space-between; align-items:center; font-size:11px; font-weight:800; z-index:1;}
  .pc-pos{background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.14); padding:2px 8px; border-radius:7px;}
  .pc-rar{color:var(--rlab); letter-spacing:.09em; font-size:9px;}
  .pc-fig{flex:1; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; min-height:0; padding:4px 0;}

  d34:   {name:"3-4 Attack",  desc:"Versatile front seven, stout against the run, flexible pressure looks.",   w:{DL:.30,LB:.42,DB:.28}},

const MATCHUP={

/* ============================ generation ============================ */
let nextId=1;
function pname(){return pick(FIRST)+" "+pick(LAST);}
function newSt(){return {gp:0,paYd:0,paTD:0,int:0,ruYd:0,ruTD:0,reYd:0,reTD:0,tkl:0,sk:0,dInt:0};}
function genPlayer(pos,yearIdx,quality){
  const base=quality*0.55+18;
  let ovr=clamp(Math.round(gauss(base+yearIdx*2.5,6)),40,92);
  let pot=clamp(ovr+RI(0,14-yearIdx*3),ovr,99);
  return {id:nextId++,name:pname(),pos,year:yearIdx,ovr,pot,inj:0,st:newSt(),mor:RI(60,80),rs:false,hist:[]};
}
function genRoster(prestige){
  const r=[];
  for(const pos of POS) for(let i=0;i<ROSTER_NEED[pos];i++) r.push(genPlayer(pos,RI(0,3),prestige));
  return r;
}
function genRecruits(){
  const list=[];
  for(let i=0;i<140;i++){
    const roll=Math.random();
    const stars=roll<0.04?5:roll<0.18?4:roll<0.62?3:2;
    const ovr={2:RI(52,60),3:RI(58,67),4:RI(65,74),5:RI(72,80)}[stars];
    const pot=clamp(ovr+RI(8,{2:14,3:18,4:22,5:24}[stars]),ovr,99);
    list.push({id:"r"+(nextId++),name:pname(),pos:pick(POS.filter(p=>p!=="K"||Math.random()<0.15)),
      stars,ovr,pot,interest:{},committed:null,suitors:[],pers:pick(Object.keys(PERS)),visited:false});
  }
  const totalP=SCHOOLS.reduce((s,x)=>s+x.p,0);
  for(const rec of list){
    const set=new Set();
    while(set.size<4){
      let x=Math.random()*totalP;
      for(let i=0;i<SCHOOLS.length;i++){x-=SCHOOLS[i].p; if(x<=0){set.add(i);break;}}
    }
    rec.suitors=[...set];
  }
  list.sort((a,b)=>b.stars-a.stars||b.pot-a.pot);
  return list;
}
function genCoach(role,quality){
  const rating=clamp(Math.round(gauss(quality,9)),48,96);
  return {id:"c"+(nextId++),name:"Coach "+pick(LAST),role,rating,
    spec:role==="OC"?pick(Object.keys(OFF_SCHEMES)):role==="DC"?pick(Object.keys(DEF_SCHEMES)):null,
    salary:+(0.35+(rating-50)*0.048).toFixed(2)};
}
function genMarket(){
  const m={};
  for(const r of STAFF_ROLES) m[r]=Array.from({length:6},()=>genCoach(r,gauss(66,9))).sort((a,b)=>b.rating-a.rating);
  return m;
}

/* ============================ schedule ============================ */
function roundRobin8(ids){
  const a=ids.slice(); const rounds=[];
  for(let r=0;r<7;r++){
    const games=[];
    for(let i=0;i<4;i++){const h=a[i],v=a[7-i]; games.push(Math.random()<0.5?[h,v]:[v,h]);}
    rounds.push(games);
    a.splice(1,0,a.pop());
  }
  return rounds;
}
function buildSchedule(){
  const weeks=Array.from({length:REG_WEEKS},()=>[]);
  for(let c=0;c<4;c++){
    const ids=[]; for(let i=0;i<32;i++) if(SCHOOLS[i].c===c) ids.push(i);
    const rr=roundRobin8(ids);
    for(let r=0;r<7;r++) for(const g of rr[r]) weeks[r+2].push({h:g[0],v:g[1],conf:true});
  }
  // Final week of the regular season is Rivalry Week: every team plays its cross-conference rival.
  for(const [a,b] of RIVAL_PAIRS){
    weeks[REG_WEEKS-1].push(Math.random()<0.5?{h:a,v:b,conf:false,riv:true}:{h:b,v:a,conf:false,riv:true});
  }
  const confPairs=[[0,1,2,3],[0,2,1,3],[0,3,1,2]];
  const ncWeeks=[0,1,9];
  ncWeeks.forEach((w,k)=>{
    const cp=confPairs[k];
    for(let j=0;j<4;j+=2){
      const A=[],B=[];
      for(let i=0;i<32;i++){if(SCHOOLS[i].c===cp[j])A.push(i); if(SCHOOLS[i].c===cp[j+1])B.push(i);}
      A.sort(()=>Math.random()-0.5); B.sort(()=>Math.random()-0.5);
      for(let i=0;i<8;i++) weeks[w].push(Math.random()<0.5?{h:A[i],v:B[i],conf:false}:{h:B[i],v:A[i],conf:false});
    }
  });
  return weeks;
}

/* ============================ ratings & staff ============================ */
function avail(t){return t.players.filter(p=>!p.inj&&!p.rs);}
function topN(players,pos,n){return players.filter(p=>p.pos===pos).sort((a,b)=>b.ovr-a.ovr).slice(0,n);}
function avg(list){return list.length?list.reduce((s,p)=>s+p.ovr,0)/list.length:45;}
function isUser(t){return t.id===state.userTeam;}
function coachRating(t,role){
  if(isUser(t)){const c=state.staff[role]; return c?c.rating:45;}
  return t.aiStaff[role];
}
function coordBonus(t,role){ // role OC/DC
  let b=(coachRating(t,role)-70)/6;
  if(isUser(t)){
    const c=state.staff[role];
    if(c) b+=(c.spec===(role==="OC"?t.off:t.def))?1.5:-1;
  }
  return b;
}
function offRating(t,talentOnly){
  const sch=OFF_SCHEMES[t.off]; const P=talentOnly?t.players:avail(t);
  const rbs=topN(P,"RB",2);
  const rbAvg=rbs.length?rbs.reduce((s,p,i)=>s+p.ovr*(i===0?0.7:0.3),0)/(rbs.length===1?0.7:1):45;
  let r=avg(topN(P,"QB",1))*sch.w.QB+rbAvg*sch.w.RB+avg(topN(P,"WR",3))*sch.w.WR+avg(topN(P,"OL",5))*sch.w.OL;
  if(!talentOnly){r+=coordBonus(t,"OC"); if(isUser(t)&&state.installingOff) r-=3;}
  return r;
}
function defRating(t,talentOnly){
  const sch=DEF_SCHEMES[t.def]; const P=talentOnly?t.players:avail(t);
  let r=avg(topN(P,"DL",4))*sch.w.DL+avg(topN(P,"LB",3))*sch.w.LB+avg(topN(P,"DB",4))*sch.w.DB;
  if(!talentOnly){r+=coordBonus(t,"DC"); if(isUser(t)&&state.installingDef) r-=3;}
  return r;
}
function teamRating(t){const o=offRating(t),d=defRating(t); return {off:o,def:d,ovr:(o+d)/2};}
function startersOf(t){
  const P=avail(t);
  return [...topN(P,"QB",1),...topN(P,"RB",2),...topN(P,"WR",3),...topN(P,"OL",5),
          ...topN(P,"DL",4),...topN(P,"LB",3),...topN(P,"DB",4),...topN(P,"K",1)];
}
function salaryPool(){return +(2.5+state.teams[state.userTeam].prestige/25).toFixed(1);}
function salaryUsed(){return +STAFF_ROLES.reduce((s,r)=>s+(state.staff[r]?state.staff[r].salary:0),0).toFixed(2);}

/* ============================ game sim ============================ */
function gameplanOf(ti){return ti===state.userTeam?GAMEPLANS[state.gameplan]:GAMEPLANS.balanced;}
/* 1 point is not a reachable football score — snap it away */
function legalScore(s){ s=Math.max(0,Math.round(s)); return s===1?(Math.random()<0.5?0:3):s; }
function playGame(hi,vi,neutral){
  const H=state.teams[hi],V=state.teams[vi];
  const oh=offRating(H),dh=defRating(H),ov=offRating(V),dv=defRating(V);
  const pace=(OFF_SCHEMES[H.off].tempo+OFF_SCHEMES[V.off].tempo)/2;
  const gh=gameplanOf(hi),gv=gameplanOf(vi);
  let mh=23+(oh-dv)*0.5+MATCHUP[H.off][V.def]+(neutral?0:2.2)+gh.mean+(pace-1)*16;
  let mv=23+(ov-dh)*0.5+MATCHUP[V.off][H.def]+gv.mean+(pace-1)*16;
  let sh=Math.round(mh+gauss(0,9.5+gh.sd+(V.def==="blitz"?1.5:0)));
  let sv=Math.round(mv+gauss(0,9.5+gv.sd+(H.def==="blitz"?1.5:0)));
  sh=legalScore(sh); sv=legalScore(sv);
  if(sh===sv){ if(Math.random()<0.5) sh+=RI(3,7); else sv+=RI(3,7); }
  return {h:hi,v:vi,sh,sv,winner:sh>sv?hi:vi};
}
function applyResult(g,conf){
  const W=state.teams[g.winner], L=state.teams[g.winner===g.h?g.v:g.h];
  W.wins++; L.losses++;
  if(conf){W.confW++; L.confL++;}
  state.teams[g.h].results.push({week:state.week,opp:g.v,home:true,us:g.sh,them:g.sv});
  state.teams[g.v].results.push({week:state.week,opp:g.h,home:false,us:g.sv,them:g.sh});
}
/* generate a statistically plausible box score for one offense; returns performer lines */
function statTeam(t,pts,oppDef,gp){
  const sch=OFF_SCHEMES[t.off], P=avail(t);
  const totYd=clamp(Math.round(pts*11.5+gauss(70,45)),100,720);
  const passShare=clamp(sch.pass+gauss(0,0.05),0.15,0.85);
  const passYd=Math.round(totYd*passShare), rushYd=totYd-passYd;
  const tds=Math.max(0,Math.round(pts/7.2));
  const passTD=clamp(Math.round(tds*passShare+gauss(0,0.5)),0,tds), rushTD=tds-passTD;
  const ints=Math.max(0,Math.round(gauss(0.8+gp.int+(oppDef==="blitz"?0.4:0),0.8)));
  const qb=topN(P,"QB",1)[0], rbs=topN(P,"RB",2), wrs=topN(P,"WR",3);
  const lines=[];
  if(qb){qb.st.gp++; qb.st.paYd+=passYd; qb.st.paTD+=passTD; qb.st.int+=ints;
    const qbRu=Math.round(rushYd*(t.off==="spread"?0.30:0.08));
    qb.st.ruYd+=qbRu;
    lines.push(`${qb.name}: ${passYd} pass yds, ${passTD} TD, ${ints} INT`);}
  const rbShare=[0.62,0.30];
  rbs.forEach((rb,i)=>{const yd=Math.round(rushYd*rbShare[i]*(t.off==="spread"?0.75:1));
    rb.st.gp++; rb.st.ruYd+=yd;
    const rtd=i===0?Math.round(rushTD*0.7):rushTD-Math.round(rushTD*0.7);
    rb.st.ruTD+=Math.max(0,rtd);
    if(i===0&&yd>30) lines.push(`${rb.name}: ${yd} rush yds${rtd>0?`, ${rtd} TD`:""}`);});
  const wrShare=[0.42,0.32,0.26];
  wrs.forEach((wr,i)=>{const yd=Math.round(passYd*wrShare[i]);
    wr.st.gp++; wr.st.reYd+=yd;
    const wtd=i===0?Math.round(passTD*0.5):i===1?Math.round(passTD*0.3):Math.max(0,passTD-Math.round(passTD*0.5)-Math.round(passTD*0.3));
    wr.st.reTD+=wtd;
    if(i===0&&yd>25) lines.push(`${wr.name}: ${yd} rec yds${wtd>0?`, ${wtd} TD`:""}`);});
  return {ints,lines};
}
function statDefense(t,oppInts,oppOL){
  const P=avail(t);
  const dls=topN(P,"DL",4), lbs=topN(P,"LB",3), dbs=topN(P,"DB",4);
  const tot=Math.round(gauss(58,8));
  lbs.forEach(p=>{p.st.gp++; p.st.tkl+=Math.round(tot*0.40/3+gauss(0,2));});
  dbs.forEach(p=>{p.st.gp++; p.st.tkl+=Math.round(tot*0.35/4+gauss(0,2));});
  dls.forEach(p=>{p.st.gp++; p.st.tkl+=Math.round(tot*0.25/4+gauss(0,1.5));});
  let sacks=Math.max(0,Math.round(gauss(2.2+(t.def==="blitz"?1.2:0)-(oppOL-65)/25,1.4)));
  while(sacks-->0){const p=pick([...dls,...lbs].filter(Boolean)); if(p)p.st.sk++;}
  let iv=oppInts;
  while(iv-->0){const p=pick(dbs.filter(Boolean)); if(p)p.st.dInt++;}
}
function simStats(res){
  const H=state.teams[res.h],V=state.teams[res.v];
  const bh=statTeam(H,res.sh,V.def,gameplanOf(res.h));
  const bv=statTeam(V,res.sv,H.def,gameplanOf(res.v));
  statDefense(H,bv.ints,avg(topN(avail(V),"OL",5)));
  statDefense(V,bh.ints,avg(topN(avail(H),"OL",5)));
  return {hLines:bh.lines,vLines:bv.lines};
}
/* injuries: roll after each played game */
function injuryRate(t){const sc=coachRating(t,"SC"); return clamp(0.042-sc*0.00028,0.012,0.036);}
function rollInjuries(t){
  const rate=injuryRate(t);
  for(const p of startersOf(t)){
    if(Math.random()<rate){
      p.inj=RI(1,5);
      if(isUser(t)) addNews(`{ic:injury} ${p.pos} ${p.name} injured — out ${p.inj} week${p.inj>1?"s":""}.`);
    }
  }
}
function healWeek(){
  for(const t of state.teams) for(const p of t.players){
    if(p.inj>0){p.inj--; if(p.inj===0&&isUser(t)) addNews(`{ic:check} ${p.pos} ${p.name} is back from injury.`);}
  }
}

/* ============================ recruiting ============================ */
function userWeeklyPoints(){
  const t=state.teams[state.userTeam];
  return 16+Math.round(t.prestige/7)+Math.round(state.budget.rec/4)+Math.max(0,Math.round((coachRating(t,"RC")-70)/4));
}
function runRecruitingWeek(){
  const targets=state.recruits.filter(r=>!r.committed&&r.targeted);
  const per=targets.length?userWeeklyPoints()/targets.length:0;
  for(const rec of state.recruits){
    if(rec.committed!==null) continue;
    for(const s of rec.suitors){
      if(s===state.userTeam) continue;
      rec.interest[s]=(rec.interest[s]||0)+SCHOOLS[s].p/12+Math.random()*4;
    }
    if(rec.targeted) rec.interest[state.userTeam]=(rec.interest[state.userTeam]||0)+(per+state.budget.nil/15)*recruitAppeal(rec);
    if(state.week>=8){
      const lead=recruitLeader(rec);
      if(lead&&lead.gap>60&&Math.random()<0.25) commitRecruit(rec,lead.team);
    }
  }
}
function recruitLeader(rec){
  const entries=Object.entries(rec.interest).map(([k,v])=>[+k,v]).sort((a,b)=>b[1]-a[1]);
  if(!entries.length||entries[0][1]<20) return null;
  return {team:entries[0][0],pts:entries[0][1],gap:entries[0][1]-(entries[1]?entries[1][1]:0)};
}
function commitRecruit(rec,teamIdx){
  if(teamIdx===state.userTeam){
    const signed=state.recruits.filter(r=>r.committed===state.userTeam).length;
    if(signed>=10){
      const alt=rec.suitors.find(s=>s!==state.userTeam);
      rec.committed=alt!==undefined?alt:RI(0,31);
      return;
    }
  }
  rec.committed=teamIdx;
  if(teamIdx===state.userTeam||rec.stars>=4)
    addNews(`${"★".repeat(rec.stars)} ${rec.pos} ${rec.name} committed to ${SCHOOLS[teamIdx].n}${teamIdx===state.userTeam?" — that's us!":""}`);
}
function signingDay(){
  for(const rec of state.recruits){
    if(rec.committed!==null) continue;
    const lead=recruitLeader(rec);
    commitRecruit(rec,lead?lead.team:pick(rec.suitors));
  }
  const mine=state.recruits.filter(r=>r.committed===state.userTeam);
  addNews(`Signing Day: we signed ${mine.length} recruit${mine.length!==1?"s":""} (${mine.filter(r=>r.stars>=4).length} four-star+).`);
}

/* ============================ L2-7: recruit appeal & official visits ============================ */
function recruitAppeal(rec){
  const u=state.teams[state.userTeam];
  switch(rec.pers){
    case "playtime":{ // thin depth at his position = easy playing time
      const good=u.players.filter(p=>p.pos===rec.pos&&p.ovr>=rec.ovr).length;
      return clamp(1.35-good*0.13,0.72,1.35);
    }
    case "nil": return clamp(0.72+state.budget.nil*0.019,0.72,1.35);
    case "titles":{
      const recent=state.history.slice(-3).filter(h=>h.confChamp||h.natChamp).length;
      return clamp(0.72+(u.prestige-45)*0.0105+recent*0.09,0.72,1.4);
    }
    case "home": return SCHOOLS[state.userTeam].c===SCHOOLS[rec.suitors[0]!==undefined?rec.suitors[0]:0].c?1.2:1.0;
    default: return 1;
  }
}
function appealLabel(rec){
  const a=recruitAppeal(rec);
  return a>=1.2?{t:"strong fit",c:"g"}:a>=0.95?{t:"neutral",c:"y"}:{t:"tough sell",c:"r"};
}
function useVisit(id){
  const rec=state.recruits.find(r=>r.id===id);
  if(!rec||rec.committed!==null) return;
  if(rec.visited){alert("He has already taken his official visit.");return;}
  if(state.visits<=0){alert("No official visits left this season. They reset each year.");return;}
  state.visits--; rec.visited=true;
  const boost=Math.round(38*recruitAppeal(rec));
  rec.interest[state.userTeam]=(rec.interest[state.userTeam]||0)+boost;
  if(!rec.targeted) rec.targeted=true;
  addNews(`{ic:stadium} ${rec.pos} ${rec.name} took an official visit — big jump in interest (+${boost}).`);
  save(); render();
}

/* ============================ L2-1/2/3: history, records, hall of fame ============================ */
function careerTotals(p){
  const t=newSt();
  for(const h of (p.hist||[])) for(const k in t) t[k]+=(h.st&&h.st[k])||0;
  for(const k in t) t[k]+=(p.st&&p.st[k])||0;
  return t;
}
function archiveSeason(t){ // called before stats are wiped for the new season
  for(const p of t.players){
    if(!p.hist) p.hist=[];
    if(p.st&&p.st.gp) p.hist.push({season:state.season,team:t.id,year:p.year,ovr:p.ovr,st:{...p.st}});
  }
}
const REC_CATS=[
  {k:"paYd",n:"Passing yards, season",  fmt:v=>v+" yds"},
  {k:"ruYd",n:"Rushing yards, season",  fmt:v=>v+" yds"},
  {k:"reYd",n:"Receiving yards, season",fmt:v=>v+" yds"},
  {k:"sk",  n:"Sacks, season",          fmt:v=>v+" sacks"},
  {k:"tkl", n:"Tackles, season",        fmt:v=>v+" tkl"},
  {k:"dInt",n:"Interceptions, season",  fmt:v=>v+" INT"},
];
function blankRecords(){
  const o={};
  for(const c of REC_CATS) o[c.k]=null;
  return o;
}
function ensureRecords(){
  if(!state.records) state.records={nat:blankRecords(),prog:{}};
  if(!state.records.prog[state.userTeam]) state.records.prog[state.userTeam]=blankRecords();
}
function updateRecords(){ // run at season end, before stats are wiped
  ensureRecords();
  const U=state.userTeam;
  const broken=[];
  for(const t of state.teams) for(const p of t.players){
    if(!p.st||!p.st.gp) continue;
    for(const c of REC_CATS){
      const v=p.st[c.k]; if(!v) continue;
      const entry={v,name:p.name,pos:p.pos,team:t.id,season:state.season};
      const nat=state.records.nat[c.k];
      if(!nat||v>nat.v){ state.records.nat[c.k]={...entry}; if(t.id===U) broken.push({scope:"national",c,entry}); }
      if(t.id===U){
        const pr=state.records.prog[U];
        if(!pr[c.k]||v>pr[c.k].v){ pr[c.k]={...entry}; broken.push({scope:"program",c,entry}); }
      }
    }
  }
  // de-duplicate: a national record is also a program record
  const seen=new Set(), out=[];
  for(const b of broken.sort((a,b)=>a.scope==="national"?-1:1)){
    const key=b.c.k+"|"+b.entry.name;
    if(seen.has(key))continue; seen.add(key); out.push(b);
  }
  for(const b of out)
    addNews(`{ic:book} ${b.scope==="national"?"NATIONAL":"Program"} record: ${b.entry.pos} ${b.entry.name} — ${b.c.fmt(b.entry.v)} (${b.c.n.split(",")[0]}).`);
  return out;
}
function hofWorthy(p,awardWinner){
  const c=careerTotals(p);
  return p.ovr>=88||awardWinner||c.paYd>=7000||c.ruYd>=3500||c.reYd>=3000||c.sk>=28||c.dInt>=14;
}
function inductHOF(t,awardNames){
  if(!state.hof) state.hof=[];
  for(const p of t.players.filter(p=>p.year>=3)){
    const won=awardNames.includes(p.name);
    if(!hofWorthy(p,won)) continue;
    const c=careerTotals(p);
    // induction happens before the offseason archive, so fold this season in by hand
    const full=(p.hist||[]).slice();
    if(p.st&&p.st.gp) full.push({season:state.season,team:t.id,year:p.year,ovr:p.ovr,st:{...p.st}});
    state.hof.push({name:p.name,pos:p.pos,team:t.id,season:state.season,ovr:p.ovr,pot:p.pot,
      seasons:full.length,st:c,award:won,
      card:{id:p.id,name:p.name,pos:p.pos,year:3,ovr:p.ovr,pot:p.pot,mor:p.mor,inj:0,rs:false,st:newSt(),hist:full}});
    addNews(`{ic:medal} ${p.pos} ${p.name} finishes his career and enters the ${SCHOOLS[t.id].n} Hall of Fame.`);
  }
}

/* ============================ L2-4: achievements ============================ */
const ACH_ICON={"first_win": "football", "conf": "medal", "natty": "trophy", "perfect": "perfect", "cinderella": "spark", "dynasty": "crown", "five_star": "star", "big_class": "notes", "poy": "medal", "coy": "whistle", "redemption": "fire", "rivalry": "swords", "record": "book", "hof": "monument"};
const ACHIEVEMENTS=[
  {id:"first_win", i:"football", n:"On the board",        d:"Win your first game."},
  {id:"conf", i:"medal", n:"Conference crown",    d:"Win a conference championship."},
  {id:"natty", i:"trophy", n:"National champions",  d:"Win the national championship."},
  {id:"perfect", i:"perfect", n:"Perfect season",      d:"Finish a regular season undefeated."},
  {id:"cinderella", i:"spark", n:"Cinderella story",    d:"Win a national title with a program under 50 prestige."},
  {id:"dynasty", i:"crown", n:"Dynasty",             d:"Win three conference titles in a row."},
  {id:"five_star", i:"star", n:"Blue-chip closer",    d:"Sign a five-star recruit."},
  {id:"big_class", i:"notes", n:"Loaded class",        d:"Sign eight or more recruits in one class."},
  {id:"poy", i:"medal", n:"Star maker",          d:"Coach a Player of the Year winner."},
  {id:"coy", i:"whistle", n:"Coach of the Year",   d:"Win Coach of the Year."},
  {id:"redemption", i:"fire", n:"Redemption",          d:"Win a title after being fired at least once."},
  {id:"rivalry", i:"swords", n:"Own the rivalry",     d:"Beat your rival three years running."},
  {id:"record", i:"book", n:"Record breaker",      d:"Set a national statistical record."},
  {id:"hof", i:"monument", n:"Legacy",              d:"Send five players to your Hall of Fame."},
];
function award(id,sub){
  if(!state.achv) state.achv={};
  if(state.achv[id]) return;
  const a=ACHIEVEMENTS.find(x=>x.id===id); if(!a) return;
  state.achv[id]={season:state.season};
  if(!state.toasts) state.toasts=[];
  state.toasts.push({i:a.i,n:T(a.n),s:sub||T(a.d)});
}
function checkAchievements(ctx){
  ctx=ctx||{};
  const u=state.teams[state.userTeam];
  if(u.wins>=1) award("first_win");
  if(u.confChamp) award("conf",`${SCHOOLS[state.userTeam].n}, ${state.season}`);
  if(u.natChamp) award("natty",`${SCHOOLS[state.userTeam].n}, ${state.season}`);
  if(u.natChamp&&u.prestige<50) award("cinderella");
  if(u.losses===0&&u.wins>=REG_WEEKS-1&&state.week>=REG_WEEKS) award("perfect",`${u.wins}-0`);
  if(state.wasFired&&(u.confChamp||u.natChamp)) award("redemption");
  // history already contains the season just finished, so three straight = last three entries
  const last3=state.history.slice(-3);
  if(last3.length===3&&last3.every(h=>h.confChamp)) award("dynasty",`${last3[0].season}–${last3[2].season}`);
  const mine=state.recruits.filter(r=>r.committed===state.userTeam);
  if(mine.some(r=>r.stars===5)) award("five_star");
  if(mine.length>=8) award("big_class",`${mine.length} signees`);
  if(ctx.poyUser) award("poy");
  if(ctx.coyUser) award("coy");
  if(ctx.natRecord) award("record");
  if((state.hof||[]).length>=5) award("hof",`${state.hof.length} inductees`);
  if((state.rivalStreak||0)>=3) award("rivalry",`${state.rivalStreak} straight`);
}

/* ============================ transfer portal ============================ */
function openPortal(){
  state.portal=[];
  for(const t of state.teams){
    if(isUser(t)){
      const starters=new Set(startersOf(t).map(p=>p.id));
      const cands=t.players.filter(p=>!starters.has(p.id)&&p.year>=1&&p.year<=2&&p.ovr>=62);
      let n=0;
      for(const p of cands){
        if(n>=3)break;
        // unhappy players bolt; NIL budget helps retention
        const chance=clamp(0.06+Math.max(0,70-(p.mor??70))*0.009-state.budget.nil*0.0012,0.02,0.5);
        if(Math.random()<chance){
          t.players=t.players.filter(x=>x.id!==p.id);
          state.portal.push({...p,from:t.id,ask:Math.max(4,Math.round((p.ovr-50)*0.75))});
          addNews(`{ic:transfer} ${p.pos} ${p.name} (${YEARS[p.year]}, ${p.ovr} OVR) entered the transfer portal.`);
          n++;
        }
      }
    } else {
      const cands=t.players.filter(p=>p.year>=1&&p.year<=2&&p.ovr>=64).sort(()=>Math.random()-0.5).slice(0,RI(0,2));
      for(const p of cands){
        t.players=t.players.filter(x=>x.id!==p.id);
        state.portal.push({...p,from:t.id,ask:Math.max(4,Math.round((p.ovr-50)*0.75))});
      }
    }
  }
  state.portal.sort((a,b)=>b.ovr-a.ovr);
  const t=state.teams[state.userTeam];
  state.portalPts=Math.round(12+state.budget.nil*0.5+t.prestige/4);
  addNews(`The transfer portal is open: ${state.portal.length} players available. You have ${state.portalPts} NIL points to spend (Recruiting tab).`);
}
function signPortal(id){
  const p=state.portal.find(x=>x.id===id);
  if(!p||p.signed) return;
  if(p.ask>state.portalPts){alert("Not enough NIL points left for this transfer.");return;}
  state.portalPts-=p.ask;
  p.signed=true;
  state.teams[state.userTeam].players.push({id:p.id,name:p.name,pos:p.pos,year:p.year,ovr:p.ovr,pot:p.pot,inj:0,st:newSt(),mor:75,rs:false});
  addNews(`{ic:pen} Transfer signed: ${p.pos} ${p.name} (${YEARS[p.year]}, ${p.ovr} OVR) from ${SCHOOLS[p.from].n}.`);
  save(); render();
}

/* ============================ awards ============================ */
function statline(p){
  const s=p.st;
  if(p.pos==="QB")return `${s.paYd} yds, ${s.paTD} TD, ${s.int} INT`;
  if(p.pos==="RB")return `${s.ruYd} rush yds, ${s.ruTD} TD`;
  if(p.pos==="WR")return `${s.reYd} rec yds, ${s.reTD} TD`;
  if(p.pos==="DB")return `${s.tkl} tkl, ${s.dInt} INT`;
  if(p.pos==="DL"||p.pos==="LB")return `${s.tkl} tkl, ${s.sk} sacks`;
  return `${p.ovr} OVR`;
}
function computeAwards(){
  let poy=null,poyS=-1,dpoy=null,dpoyS=-1;
  for(const t of state.teams)for(const p of t.players){
    const s=p.st;
    const os=s.paYd*0.045+s.paTD*3.5+s.ruYd*0.07+s.ruTD*4.5+s.reYd*0.06+s.reTD*4.5+t.wins*1.5;
    const ds=s.tkl*0.35+s.sk*4+s.dInt*5+t.wins*1.5;
    if(os>poyS){poyS=os;poy={p,t};}
    if(ds>dpoyS){dpoyS=ds;dpoy={p,t};}
  }
  let coy=null,coyS=-99;
  for(const t of state.teams){const d=t.wins-expectedWins(t.prestige); if(d>coyS){coyS=d;coy=t;}}
  const fmt=x=>x?`${x.p.name} (${x.p.pos}, ${SCHOOLS[x.t.id].n}) — ${statline(x.p)}`:"—";
  return {poy:fmt(poy),dpoy:fmt(dpoy),
    coy:coy?`${SCHOOLS[coy.id].n} (${coy.wins}-${coy.losses}, expected ~${expectedWins(coy.prestige)} wins)`:"—",
    poyUser:poy&&poy.t.id===state.userTeam, dpoyUser:dpoy&&dpoy.t.id===state.userTeam, coyUser:coy&&coy.id===state.userTeam};
}

/* ============================ season flow ============================ */
let state=null;
function addNews(txt){state.news.unshift({week:state.week,season:state.season,txt}); state.news=state.news.slice(0,80);}
function makeTeam(s,i){
  return {id:i,prestige:s.p,players:genRoster(s.p),wins:0,losses:0,confW:0,confL:0,results:[],
    confChamp:false,natChamp:false,
    off:pick(Object.keys(OFF_SCHEMES)),def:pick(Object.keys(DEF_SCHEMES)),
    aiStaff:{OC:clamp(Math.round(gauss(s.p,8)),50,95),DC:clamp(Math.round(gauss(s.p,8)),50,95),
             RC:clamp(Math.round(gauss(s.p,8)),50,95),SC:clamp(Math.round(gauss(s.p,8)),50,95)}};
}
function newGame(userTeamIdx){
  nextId=1;
  const p=SCHOOLS[userTeamIdx].p;
  pickingTeam=false;
  state={version:7,season:2026,week:0,userTeam:userTeamIdx,confidence:50,budget:{fac:34,rec:33,nil:33},
    lang:uiLang,simStops:{injury:true,rivalry:true,playoff:true},onboard:{tabs:{},hidden:false},
    career:{seasons:0,wins:0,losses:0,confTitles:0,natTitles:0,stops:[{team:userTeamIdx,season:2026}]},
    offers:[],live:null,
    teams:SCHOOLS.map(makeTeam),news:[],history:[],recruits:genRecruits(),
    schedule:buildSchedule(),post:{confGames:[],semis:[],final:null,champs:[],natChamp:null},
    staff:{OC:genCoach("OC",48+p/4),DC:genCoach("DC",48+p/4),RC:genCoach("RC",48+p/4),SC:genCoach("SC",48+p/4)},
    market:genMarket(),gameplan:"balanced",installingOff:false,installingDef:false,
    portal:[],portalPts:0,lastBox:null,tab:"dash",fired:false,
    oq:[],prevPoll:null,recapOn:true,
    records:null,hof:[],achv:{},toasts:[],visits:3,rivalStreak:0,wasFired:false,modal:null};
  const u=state.teams[userTeamIdx];
  state.staff.OC.spec=u.off; state.staff.DC.spec=u.def; // starting staff fits current playbook
  addNews(`Welcome to ${SCHOOLS[userTeamIdx].n}! Review your staff, pick your playbooks, set the budget and build a recruiting board — then advance.`);
  save(); render();
}
function confStandings(c){
  const ids=[]; for(let i=0;i<32;i++) if(SCHOOLS[i].c===c) ids.push(i);
  return ids.sort((a,b)=>{
    const A=state.teams[a],B=state.teams[b];
    return (B.confW-B.confL)-(A.confW-A.confL)||B.wins-A.wins||B.prestige-A.prestige;
  });
}
function top25(){
  return state.teams.map(t=>({id:t.id,score:t.wins*9-t.losses*3+teamRating(t).ovr*0.9+t.prestige*0.15}))
    .sort((a,b)=>b.score-a.score).slice(0,25).map(x=>x.id);
}
function userRank(){const i=top25().indexOf(state.userTeam); return i<0?null:i+1;}

function advanceWeek(liveRes){
  if(state.fired) return;
  healWeek();
  const sameGame=(res,x,y)=>!!res&&res.h===x&&res.v===y;
  const pollBefore=top25();
  let weekGames=[], recapLabel="", ceremony=false;
  if(state.week<REG_WEEKS){
    const games=state.schedule[state.week];
    state.week++;
    recapLabel="Week "+state.week;
    for(const g of games){
      const res=sameGame(liveRes,g.h,g.v)?liveRes:playGame(g.h,g.v,false);
      applyResult(res,g.conf);
      weekGames.push(res);
      const box=simStats(res);
      if(g.h===state.userTeam||g.v===state.userTeam){
        const home=g.h===state.userTeam;
        state.lastBox={opp:home?g.v:g.h,home,us:home?res.sh:res.sv,them:home?res.sv:res.sh,
          usLines:home?box.hLines:box.vLines,oppLines:home?box.vLines:box.hLines};
      }
    }
    for(const t of state.teams) if(t.results.some(r=>r.week===state.week)) rollInjuries(t);
    updateMorale();
    const u=state.teams[state.userTeam];
    const last=u.results[u.results.length-1];
    if(last){
      const opp=SCHOOLS[last.opp];
      const isRiv=RIVALS[state.userTeam]===last.opp;
      if(isRiv){ // L2-5: the rivalry game swings the board
        const won=last.us>last.them;
        state.confidence=clamp(state.confidence+(won?5:-5),0,100);
        state.rivalStreak=won?(state.rivalStreak||0)+1:0;
        addNews(`{ic:swords} RIVALRY: ${won?"We beat":"We lost to"} ${opp.n} ${last.us}–${last.them}. The board ${won?"loves it (+5)":"is not amused (−5)"}.${won&&state.rivalStreak>1?` ${state.rivalStreak} in a row.`:""}`);
      } else {
        addNews(`${last.us>last.them?"WIN":"LOSS"} ${last.us}–${last.them} ${last.home?"vs":"at"} ${opp.n} ${opp.m}.`);
      }
    }
    checkAchievements();
    runRecruitingWeek();
  } else if(state.week===REG_WEEKS){
    state.week=CONF_WEEK;
    recapLabel="Conference championships";
    state.post.champs=[];
    for(let c=0;c<4;c++){
      const st=confStandings(c);
      const res=sameGame(liveRes,st[0],st[1])?liveRes:playGame(st[0],st[1],true);
      applyResult(res,false); simStats(res);
      weekGames.push(res);
      state.post.confGames.push(res);
      state.teams[res.winner].confChamp=true;
      state.post.champs.push(res.winner);
      addNews(`${SCHOOLS[res.winner].n} wins the ${CONFS[c]} title, ${Math.max(res.sh,res.sv)}–${Math.min(res.sh,res.sv)} over ${SCHOOLS[res.winner===res.h?res.v:res.h].n}.`);
      if(res.winner===state.userTeam){ queueCeremony("conf",res); ceremony=true; }
    }
    runRecruitingWeek();
  } else if(state.week===CONF_WEEK){
    state.week=SEMI_WEEK;
    recapLabel="Playoff semifinals";
    const seeds=state.post.champs.slice().sort((a,b)=>state.teams[b].wins-state.teams[a].wins);
    const s1=sameGame(liveRes,seeds[0],seeds[3])?liveRes:playGame(seeds[0],seeds[3],true);
    const s2=sameGame(liveRes,seeds[1],seeds[2])?liveRes:playGame(seeds[1],seeds[2],true);
    applyResult(s1,false); applyResult(s2,false); simStats(s1); simStats(s2);
    weekGames.push(s1,s2);
    state.post.semis=[s1,s2];
    addNews(`Playoff semifinals: ${SCHOOLS[s1.winner].n} and ${SCHOOLS[s2.winner].n} advance to the National Championship.`);
    runRecruitingWeek();
  } else if(state.week===SEMI_WEEK){
    state.week=FINAL_WEEK;
    recapLabel="National championship";
    const a=state.post.semis[0].winner,b=state.post.semis[1].winner;
    const f=sameGame(liveRes,a,b)?liveRes:playGame(a,b,true);
    applyResult(f,false); simStats(f);
    weekGames.push(f);
    state.post.final=f;
    state.post.natChamp=f.winner;
    state.teams[f.winner].natChamp=true;
    addNews(`{ic:trophy} ${SCHOOLS[f.winner].n} ${SCHOOLS[f.winner].m} are NATIONAL CHAMPIONS! Final: ${Math.max(f.sh,f.sv)}–${Math.min(f.sh,f.sv)}.`);
    if(f.winner===state.userTeam){ queueCeremony("nat",f); ceremony=true; }
    runRecruitingWeek();
  } else if(state.week===FINAL_WEEK){
    state.week=SIGN_WEEK;
    signingDay();
    const aw=computeAwards();
    addNews(`{ic:medal} Player of the Year: ${aw.poy}${aw.poyUser?" — OUR GUY!":""}`);
    addNews(`{ic:shield} Defensive Player of the Year: ${aw.dpoy}${aw.dpoyUser?" — OUR GUY!":""}`);
    addNews(`{ic:whistle} Coach of the Year: ${aw.coy}${aw.coyUser?" — that's YOU!":""}`);
    state.lastAwards=aw;
    const broken=updateRecords();                       // L2-2
    inductHOF(state.teams[state.userTeam],[aw.poy,aw.dpoy].map(s=>String(s).split(" (")[0])); // L2-3
    endOfSeasonReview();
    checkAchievements({poyUser:aw.poyUser,coyUser:aw.coyUser,
      natRecord:broken.some(b=>b.scope==="national")});  // L2-4
    openPack();
    openPortal();
    genOffers();
  }
  if(weekGames.length){
    state.prevPoll=pollBefore; // set first: the recap reads movement against it
    if(!liveRes&&!ceremony&&state.recapOn!==false&&!state.simming) buildRecap(weekGames,recapLabel);
  }
  save();
  if(!state.simming) render(); // the multi-week sim paints once at the end
}

/* --- L3-3: simulate several weeks, pausing on what matters --- */
function simToEnd(){
  if(state.fired||state.live||(state.oq&&state.oq.length)) return;
  const stops=state.simStops||{injury:true,rivalry:true,playoff:true};
  state.simming=true;
  let guard=0, stop=null, played=0;
  while(!state.fired&&state.week<SIGN_WEEK&&guard++<40){
    const nx=nextOpponent();
    if(stops.rivalry&&nx&&RIVALS[state.userTeam]===nx.idx&&played>0){ stop={k:"rivalry",team:nx.idx}; break; }
    if(stops.playoff&&state.week>=REG_WEEKS&&pendingUserGame()&&played>0){ stop={k:"playoff"}; break; }
    const u=state.teams[state.userTeam];
    const wasStarter=new Set(startersOf(u).map(p=>p.id));
    advanceWeek(); played++;
    const hurt=u.players.find(p=>p.inj>0&&wasStarter.has(p.id));
    if(stops.injury&&hurt){ stop={k:"injury",name:hurt.name,pos:hurt.pos,w:hurt.inj}; break; }
  }
  state.simming=false;
  if(stop){
    if(stop.k==="rivalry") addNews(T("{ic:pause} Simulation paused — rivalry week against {0}.",SCHOOLS[stop.team].n));
    else if(stop.k==="playoff") addNews(T("{ic:pause} Simulation paused — we have a postseason game."));
    else addNews(T("{ic:pause} Simulation paused — {0} {1} went down for {2} week(s).",stop.pos,stop.name,stop.w));
  } else if(played) addNews(T("Simulated {0} week(s) through to the end of the season.",played));
  save(); render();
}
function toggleStop(k){
  if(!state.simStops) state.simStops={injury:true,rivalry:true,playoff:true};
  state.simStops[k]=!state.simStops[k];
  save(); render();
}

/* --- L3-5: first-career onboarding --- */

  dash:"Your week starts here. The buttons top right advance the season.",
  roster:"Your squad as collectible cards. Click any player to open his file.",
  sched:"Your 11-game season. The last week is always your rivalry game.",

  budget:"Split 100 points across facilities, recruiting and NIL — plus your game settings.",
  hist:"Records, Hall of Fame, achievements and your coaching career.",
};
function onboardSteps(){
  const u=state.teams[state.userTeam];
  const staffFull=STAFF_ROLES.every(r=>state.staff[r]);
  const ob=state.onboard||{tabs:{}};

    {k:"staff",  d:T("Check your coaching staff"),  ok:staffFull&&!!ob.tabs.staff,     tab:"staff"},

function showOnboarding(){
  return state.career&&state.career.seasons===0&&state.week===0&&!(state.onboard&&state.onboard.hidden);
}
function hideOnboarding(){ if(!state.onboard)state.onboard={tabs:{}}; state.onboard.hidden=true; save(); render(); }

function expectedWins(prestige){return clamp(Math.round((prestige-30)/8),2,10);}
function endOfSeasonReview(){
  const u=state.teams[state.userTeam];
  const exp=expectedWins(u.prestige);
  let delta=(u.wins-exp)*6;
  if(u.confChamp) delta+=12;
  if(u.natChamp) delta+=25;
  state.confidence=clamp(state.confidence+delta,0,100);
  const verdict=delta>=10?"The board is thrilled.":delta>=0?"The board is satisfied.":delta>=-15?"The board expected more.":"The board is furious.";
  addNews(`Season review: ${u.wins}-${u.losses} (expected ~${exp} wins). ${verdict} Board confidence: ${state.confidence}%.`);
  if(state.confidence<15){
    state.fired=true; state.wasFired=true;
    addNews(`You have been relieved of your duties at ${SCHOOLS[state.userTeam].n}.`);
  }
  for(const t of state.teams){
    let d=Math.round((t.wins-expectedWins(t.prestige))*0.8);
    if(t.confChamp)d+=2; if(t.natChamp)d+=4;
    t.prestige=clamp(t.prestige+clamp(d,-4,6),35,99);
  }
  state.career.seasons++; state.career.wins+=u.wins; state.career.losses+=u.losses;
  if(u.confChamp)state.career.confTitles++; if(u.natChamp)state.career.natTitles++;
  state.history.push({season:state.season,champ:state.post.natChamp,team:state.userTeam,
    userW:u.wins,userL:u.losses,confChamp:u.confChamp,natChamp:u.natChamp,awards:state.lastAwards});
}

function offseasonStaff(){
  const u=state.teams[state.userTeam];
  for(const role of STAFF_ROLES){
    const c=state.staff[role];
    if(!c) continue;
    const p=clamp((c.rating-72)/80,0,0.3)+(u.wins>=11?0.10:0);
    if(Math.random()<p){
      addNews(`{ic:briefcase} ${ROLE_INFO[role].name} ${c.name} (${c.rating}) was hired away by a bigger program. The seat is open.`);
      state.staff[role]=null;
    } else {
      c.rating=clamp(c.rating+RI(-1,2),48,96);
    }
  }
  state.market=genMarket();
}

function startNewSeason(){
  const facBoost=state.budget.fac/40;
  const scBoost=Math.max(0,(coachRating(state.teams[state.userTeam],"SC")-70)/25);
  offseasonStaff();
  // L1-4: snapshot the roster so we can report on the offseason
  const uT=state.teams[state.userTeam];
  const before=new Map(uT.players.map(p=>[p.id,p.ovr]));
  const grads=uT.players.filter(p=>p.year>=3)
    .sort((a,b)=>b.ovr-a.ovr).slice(0,6).map(p=>({name:p.name,pos:p.pos,ovr:p.ovr}));
  const rsCount=uT.players.filter(p=>p.rs).length;
  for(const t of state.teams){
    const usr=isUser(t);
    archiveSeason(t); // L2-1: bank this season's stats before they are wiped
    t.players=t.players.filter(p=>p.year<3);
    for(const p of t.players){
      const boost=usr?facBoost+scBoost:1.2;
      const rsBoost=p.rs?1.5:0; // redshirt year = extra development
      p.ovr=clamp(Math.round(p.ovr+clamp(gauss(1.5+boost+rsBoost,2),0,8)),40,p.pot);
      if(!p.rs) p.year++;
      p.rs=false; p.inj=0; p.st=newSt();
      p.mor=clamp(Math.round(((p.mor??70)+72)/2)+(t.natChamp?5:0),5,99);
    }
    for(const rec of state.recruits.filter(r=>r.committed===t.id)){
      t.players.push({id:nextId++,name:rec.name,pos:rec.pos,year:0,ovr:rec.ovr,pot:rec.pot,inj:0,st:newSt(),mor:RI(65,85),rs:false,hist:[]});
    }
    for(const pos of POS){
      while(t.players.filter(p=>p.pos===pos).length<ROSTER_NEED[pos]){
        t.players.push(genPlayer(pos,0,Math.max(38,t.prestige-22)));
      }
    }
    t.wins=0;t.losses=0;t.confW=0;t.confL=0;t.results=[];t.confChamp=false;t.natChamp=false;
    if(!usr&&Math.random()<0.12){t.off=pick(Object.keys(OFF_SCHEMES)); t.def=pick(Object.keys(DEF_SCHEMES));}
  }
  state.season++; state.week=0;
  state.schedule=buildSchedule();
  state.recruits=genRecruits();
  state.post={confGames:[],semis:[],final:null,champs:[],natChamp:null};
  state.portal=[]; state.portalPts=0; state.lastBox=null;
  state.offers=[]; state.live=null;
  state.installingOff=false; state.installingDef=false;
  state.prevPoll=null; state.oq=[];
  state.visits=3; // L2-7: official visits reset each season
  addNews(`${state.season} season begins. Freshmen and transfers are in, the roster developed over the summer. You have 3 official visits to spend on recruits.`);
  // L1-4: summer camp report
  const gains=uT.players.filter(p=>before.has(p.id)&&p.ovr>before.get(p.id))
    .map(p=>({name:p.name,pos:p.pos,year:p.year,to:p.ovr,d:p.ovr-before.get(p.id)}))
    .sort((a,b)=>b.d-a.d).slice(0,6)
    .map(g=>({...g,break:g.d>=5}));
  const arrivals=uT.players.filter(p=>!before.has(p.id))
    .sort((a,b)=>b.ovr-a.ovr).slice(0,6).map(p=>({name:p.name,pos:p.pos,ovr:p.ovr}));
  pushOvl({t:"camp",d:{season:state.season,gains,in:arrivals,out:grads,rs:rsCount}});
  save(); render();
}

/* ============================ staff actions ============================ */
function hireCoach(role,id){
  const cand=state.market[role].find(c=>c.id===id);
  if(!cand) return;
  const cur=state.staff[role]?state.staff[role].salary:0;
  if(salaryUsed()-cur+cand.salary>salaryPool()+0.001){alert("Not enough salary pool. Fire someone or wait for prestige to grow the pool.");return;}
  if(state.staff[role]) addNews(`${ROLE_INFO[role].name} ${state.staff[role].name} was let go.`);
  state.staff[role]=cand;
  state.market[role]=state.market[role].filter(c=>c.id!==id);
  addNews(`{ic:pen} Hired ${cand.name} as ${ROLE_INFO[role].name} (rating ${cand.rating}, $${cand.salary}M).`);
  save(); render();
}
function fireCoach(role){
  if(!state.staff[role]) return;
  if(!confirm(`Fire ${state.staff[role].name}? The seat stays empty (big penalty) until you hire a replacement.`))return;
  addNews(`${ROLE_INFO[role].name} ${state.staff[role].name} was fired.`);
  state.staff[role]=null;
  save(); render();
}
function setScheme(side,key){
  const u=state.teams[state.userTeam];
  if(side==="off"){
    if(u.off===key)return;
    u.off=key;
    if(state.week>0&&state.week<SIGN_WEEK){state.installingOff=true; addNews(`Offense switched to ${OFF_SCHEMES[key].name} mid-season — the install costs you until next year.`);}
    else addNews(`Offensive playbook set to ${OFF_SCHEMES[key].name}.`);
  } else {
    if(u.def===key)return;
    u.def=key;
    if(state.week>0&&state.week<SIGN_WEEK){state.installingDef=true; addNews(`Defense switched to ${DEF_SCHEMES[key].name} mid-season — the install costs you until next year.`);}
    else addNews(`Defensive playbook set to ${DEF_SCHEMES[key].name}.`);
  }
  save(); render();
}
function setGameplan(v){state.gameplan=v; save(); render();}

/* ============================ morale & redshirts ============================ */
function updateMorale(){
  const u=state.teams[state.userTeam];
  const last=u.results[u.results.length-1];
  if(!last||last.week!==state.week) return;
  const won=last.us>last.them;
  const starters=new Set(startersOf(u).map(p=>p.id));
  for(const p of u.players){
    let d=won?2:-3;
    if(!starters.has(p.id)&&p.year>=1&&p.ovr>=68) d-=1; // talented bench player wants snaps
    p.mor=clamp((p.mor??70)+d,5,99);
  }
}
function toggleRedshirt(id){
  if(state.week!==0){alert("Redshirts can only be set or removed in the preseason.");return;}
  const u=state.teams[state.userTeam];
  const p=u.players.find(x=>x.id===id); if(!p)return;
  if(!p.rs){
    if(p.year!==0){alert("Only freshmen can redshirt.");return;}
    if(u.players.filter(x=>x.rs).length>=6){alert("Maximum 6 redshirts per season.");return;}
    p.rs=true;
  } else p.rs=false;
  save(); render();
}

/* ============================ coaching career & job market ============================ */
function coachRep(){
  const c=state.career;
  return clamp(Math.round(28+c.wins*0.8-c.losses*0.3+c.confTitles*6+c.natTitles*15),10,99);
}
function genOffers(){
  const rep=coachRep();
  const cur=state.teams[state.userTeam].prestige;
  const pool=state.teams.filter(t=>!isUser(t)&&t.wins<expectedWins(t.prestige)-1)
    .sort(()=>Math.random()-0.5).slice(0,5);
  let offers=pool.filter(t=>state.fired
      ? t.prestige<=58
      : (t.prestige<=rep+18&&t.prestige>=cur-20&&t.prestige!==cur))
    .map(t=>t.id).slice(0,3);
  if(state.fired&&!offers.length){
    const low=state.teams.filter(t=>!isUser(t)).sort((a,b)=>a.prestige-b.prestige).slice(0,3);
    offers=[pick(low).id];
  }
  state.offers=offers;
  if(offers.length){
    if(state.fired) addNews(`{ic:phone} Despite the firing, ${offers.length} program${offers.length>1?"s are":" is"} offering you a rebuild job (see Dashboard).`);
    else addNews(`{ic:phone} ${offers.length} program${offers.length>1?"s want":" wants"} to talk to you about their head-coaching job (see Dashboard).`);
  }
}
function acceptOffer(id){
  if(!state.offers.includes(id))return;
  const from=SCHOOLS[state.userTeam].n;
  if(!confirm(`Leave ${from} to become head coach at ${SCHOOLS[id].n}?`))return;
  const wasFired=state.fired;
  state.userTeam=id;
  state.confidence=wasFired?40:50;
  state.fired=false;
  state.offers=[];
  state.recruits.forEach(r=>r.targeted=false);
  state.installingOff=false; state.installingDef=false;
  state.career.stops.push({team:id,season:state.season+1});
  const t=state.teams[id];
  state.portalPts=Math.round(12+state.budget.nil*0.5+t.prestige/4);
  addNews(`{ic:grad} You are the new head coach at ${SCHOOLS[id].n} ${SCHOOLS[id].m}. Your coordinators come with you. The class this program signed is now yours.`);
  save(); render();
}

const KEY_COUNTS={QB:1,RB:2,WR:3,OL:5,DL:4,LB:3,DB:4,K:1};
function keyAvg(t,play){
  const P=avail(t);
  const vals=play.k.map(pos=>avg(topN(P,pos,KEY_COUNTS[pos]||2)));
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

  const row=Object.entries(PLAY_CM[play.t]).sort((a,b)=>b[1]-a[1]);
  return {best:row[0][0],worst:row[row.length-1][0]};
}
function callHint(dcall){ // what this defensive call shuts down / concedes
  const col=Object.keys(PLAY_CM).map(pt=>[pt,PLAY_CM[pt][dcall.t]]).sort((a,b)=>a[1]-b[1]);
  return {stops:col[0][0],concedes:col[col.length-1][0]};
}

/* ---- sequence resolution: the chess move ---- */
function resolveSeq(O,D,play,dcall,userOff){
  // Team strength applies to all three sequences of a drive, so it compounds —
  // keep its per-sequence weight small or rating gaps explode into blowouts.
  const base=(offRating(O)-defRating(D))*0.14;
  const cm=PLAY_CM[play.t][dcall.t]*4;
  const fit=clamp((keyAvg(O,play)-70)*0.18,-5,6);
  const sig=(userOff&&play.sig&&state.staff.OC&&state.staff.OC.spec===O.off)?2:0;
  let rep=0;
  if(userOff) rep=Math.max(-8,-4*state.live.lastPlays.filter(x=>x===play.id).length);
  const s=gauss(0,6.5)+base+cm+fit+sig+rep;
  const r=play.r||0;
  if(s>=8.5-r*2) return "BIG";
  if(s>=-6) return "ADV";
  if(s>=-16+r*2) return "STALL";
  return "TO";
}
function seqDesc(O,play,ev){
  const P=avail(O);
  const qb=topN(P,"QB",1)[0], rb=topN(P,"RB",1)[0], wr=topN(P,"WR",1)[0];
  const nm=p=>p?p.name:"the offense";
  const star=play.k&&(play.k[0]==="RB"||play.k[0]==="OL")?nm(rb):play.k&&play.k.includes("WR")?nm(wr):nm(qb);
  const bank={
    BIG:[`${play.n} breaks wide open — ${star} rips off a huge gain!`,`they never saw ${play.n} coming — ${star} explodes downfield`],
    ADV:[`${play.n} moves the chains`,`steady gain on ${play.n}`,`${star} keeps the drive alive on ${play.n}`],
    TD:[`${play.n} finishes it — ${star} scores!`,`touchdown! ${play.n} walks it in behind ${star}`],
    BIGTD:[`${play.n} goes the distance — ${star} takes it to the house!`],
    STALL:[`${play.n} gets stuffed`,`the defense sniffs out ${play.n}`,`${play.n} goes nowhere`],
    TO:[`disaster — ${play.n} ends in a turnover!`,`the defense jumps ${play.n} and takes the ball away!`],
  };
  return pick(bank[ev]||bank.ADV);
}
function seqLog(offIdx,zone,playN,dcallN,ev,desc,pts){
  const L=state.live;
  pts=pts||0;
  if(pts){ if(offIdx===L.h)L.sh+=pts; else L.sv+=pts; }
  const q=Math.min(4,Math.floor(L.i/(L.total/4))+1);
  L.log.unshift({q,zone,off:offIdx,playN,dcallN,ev,pts,desc,sh:L.sh,sv:L.sv});
}
function endDrive(){
  const L=state.live;
  L.stage=0; L.i++;
  if(L.i>=L.total){
    if(L.sh===L.sv) liveOvertime();
    L.done=true;
  }
}

/* ---- AI pickers ---- */
function aiPickOff(O,ctx){ // ctx: {stage,diff,late,avoid}
  const lib=OFF_PLAYS[O.off];
  const passP=OFF_SCHEMES[O.off].pass;
  const wT={run:(1-passP)*1.6, short:passP*0.9, deep:passP*0.6, screen:0.45, trick:0.2};
  if(ctx.stage===2){ wT.deep*=0.3; wT.trick*=0.5; wT.run*=1.3; }
  if(ctx.late&&ctx.diff<-8){ wT.deep*=2.5; wT.short*=1.4; wT.run*=0.3; }
  if(ctx.late&&ctx.diff>8){ wT.run*=2.5; wT.deep*=0.2; }
  const avoid=ctx.avoid||[];
  const weights=lib.map(p=>(wT[p.t]||0.3)*(avoid.includes(p.id)?0.03:1));
  let x=Math.random()*weights.reduce((a,b)=>a+b,0);
  for(let i=0;i<lib.length;i++){ x-=weights[i]; if(x<=0) return lib[i]; }
  return lib[0];
}
function aiPickDef(L,D,O){ // reads the opposing offense's observed tendencies
  const lib=DEF_PLAYS[D.def];
  const tend=L?L.tend:null;
  const passP=OFF_SCHEMES[O.off].pass;
  const prior={run:1-passP, short:passP*0.5, deep:passP*0.3, screen:0.12, trick:0.06};
  const tot=tend?Object.values(tend).reduce((a,b)=>a+b,0):0;
  const trust=Math.min(1,tot/6);
  const mix={};
  for(const t of Object.keys(PLAY_CM))
    mix[t]=(1-trust)*(prior[t]||0.05)+trust*(tot?(tend[t]||0)/tot:0);
  const scored=lib.map(c=>{
    let ev=0; for(const t in mix) ev+=mix[t]*PLAY_CM[t][c.t];
    return {c,ev};
  }).sort((a,b)=>a.ev-b.ev); // defense wants the offense's edge as low as possible
  const roll=Math.random();
  if(roll<0.35) return pick(lib);                    // stay unpredictable
  return roll<0.8?scored[0].c:scored[1].c;
}

/* ---- one sequence of the current drive ---- */
function playLiveSeq(choiceId){
  const L=state.live;
  if(!L||L.done||L.pending)return;
  const offIdx=liveOffenseIdx(), defIdx=offIdx===L.h?L.v:L.h;
  const O=state.teams[offIdx], D=state.teams[defIdx];
  const userOff=offIdx===state.userTeam;
  const diff=offIdx===L.h?L.sh-L.sv:L.sv-L.sh;
  const ctxUser={stage:L.stage,diff,late:L.i>=L.total-6,avoid:L.lastPlays};
  const ctxAI={stage:L.stage,diff,late:L.i>=L.total-6,avoid:L.aiLast?[L.aiLast]:[]};
  let play,dcall;
  if(userOff){
    play=OFF_PLAYS[O.off].find(p=>p.id===choiceId)||aiPickOff(O,ctxUser);
    dcall=aiPickDef(L,D,O);
    L.tend[play.t]++; L.lastPlays=[play.id,...L.lastPlays].slice(0,3);
  }else{
    dcall=DEF_PLAYS[D.def].find(c=>c.id===choiceId)||aiPickDef({tend:L.aiTend},D,O);
    play=aiPickOff(O,ctxAI);
    L.aiTend[play.t]++; L.aiLast=play.id;
  }
  const out=resolveSeq(O,D,play,dcall,userOff);
  L.lastSeq={playN:play.n,dcallN:dcall.n,out,off:offIdx};
  const zone=L.stage;
  if(out==="TO"){ seqLog(offIdx,zone,play.n,dcall.n,"TO",seqDesc(O,play,"TO")); endDrive(); }
  else if(out==="STALL") handleStall(offIdx,zone,play,dcall,O,D);
  else if(out==="BIG"){
    if(zone===0){ L.stage=2; seqLog(offIdx,zone,play.n,dcall.n,"BIG",seqDesc(O,play,"BIG")); }
    else scoreTD(offIdx,zone,play,dcall,O,true);
  } else { // ADV
    if(zone===2) scoreTD(offIdx,zone,play,dcall,O,false);
    else { L.stage++; seqLog(offIdx,zone,play.n,dcall.n,"ADV",seqDesc(O,play,"ADV")); }
  }
}
function scoreTD(offIdx,zone,play,dcall,O,big){
  const L=state.live;
  const userOff=offIdx===state.userTeam;
  const myScore=offIdx===L.h?L.sh:L.sv, theirScore=offIdx===L.h?L.sv:L.sh;
  const after=(myScore+6)-theirScore;
  const desc=seqDesc(O,play,big?"BIGTD":"TD");
  if(userOff&&L.i>=L.total-6&&Math.abs(after)<=8){
    L.pending={kind:"twopt",xp:0.96,two:0.47,margin:after,offIdx,zone,playN:play.n,dcallN:dcall.n,desc};
    return;
  }
  seqLog(offIdx,zone,play.n,dcall.n,big?"BIGTD":"TD",desc,7);
  endDrive();
}
function handleStall(offIdx,zone,play,dcall,O,D){
  const L=state.live;
  const userOff=offIdx===state.userTeam;
  if(zone===0){ seqLog(offIdx,zone,play.n,dcall.n,"PUNT",seqDesc(O,play,"STALL")+" — "+T("punt away")); endDrive(); return; }
  const edge=(offRating(O)-defRating(D))*0.01;
  const P={kind:"fourth",go:clamp(0.5+edge,0.3,0.72),fg:zone===2?0.76:0.45,dist:RI(1,3),
    zone,offIdx,playN:play.n,dcallN:dcall.n};
  if(userOff){ L.pending=P; return; }
  const diff=offIdx===L.h?L.sh-L.sv:L.sv-L.sh;
  let choice;
  if(zone===2) choice=(diff<-8&&L.i>=L.total-4)?"go":"fg";
  else choice=((P.dist<=1&&Math.random()<0.5)||(diff<-8&&L.i>=L.total-4))?"go":"punt";
  resolveFourth(choice,P);
}
function resolveFourth(choice,P){
  const L=state.live, offIdx=P.offIdx, O=state.teams[offIdx];
  if(choice==="punt"){
    seqLog(offIdx,P.zone,P.playN,P.dcallN,"PUNT",T("4th and {0} — the punt team comes on",P.dist)); endDrive(); return;
  }
  if(choice==="fg"){
    if(Math.random()<P.fg) seqLog(offIdx,P.zone,P.playN,P.dcallN,"FG",T("4th and {0} — the field goal is up… GOOD",P.dist),3);
    else seqLog(offIdx,P.zone,P.playN,P.dcallN,"MISS",T("4th and {0} — the field goal sails wide",P.dist));
    endDrive(); return;
  }
  // go for it
  if(Math.random()<P.go){
    if(P.zone===2){ seqLog(offIdx,P.zone,P.playN,P.dcallN,"TD",T("4th and {0} — converted, and punched in for the touchdown!",P.dist),7); endDrive(); }
    else { L.stage=2; seqLog(offIdx,P.zone,P.playN,P.dcallN,"CONV",T("4th and {0} — converted! The drive rolls on",P.dist)); }
  } else {
    seqLog(offIdx,P.zone,P.playN,P.dcallN,"TO",T("4th and {0} — stuffed. Turnover on downs",P.dist)); endDrive();
  }
}
function liveDecide(choice){
  const L=state.live; if(!L||!L.pending) return;
  const P=L.pending; L.pending=null;
  if(P.kind==="fourth"){ resolveFourth(choice,P); save(); render(); return; }
  // two-point decision — the touchdown is already earned
  let pts,suffix;
  if(choice==="xp"){ const made=Math.random()<P.xp; pts=made?7:6; suffix=made?T(" — extra point good"):T(" — the extra point is BLOCKED"); }
  else { const made=Math.random()<P.two; pts=made?8:6; suffix=made?T(" — two-point conversion GOOD!"):T(" — two-point try stopped short"); }
  seqLog(P.offIdx,P.zone,P.playN,P.dcallN,"TD",P.desc+suffix,pts);
  endDrive();
  save(); render();
}
function liveDecideAuto(){
  const L=state.live; if(!L||!L.pending)return;
  const P=L.pending;
  if(P.kind==="fourth") liveDecide(P.zone===2?"fg":(P.dist<=1?"go":"punt"));
  else liveDecide((P.margin===-2||P.margin===2||P.margin===5)?"two":"xp");
}
function autoDrivePts(O,D){ // full drive, both sides on autopilot (overtime, abandoned games)
  let stage=0, guard=0;
  while(guard++<6){
    const play=aiPickOff(O,{stage,diff:0,late:false,avoid:[]});
    const dcall=aiPickDef(null,D,O);
    const out=resolveSeq(O,D,play,dcall,false);
    if(out==="TO") return 0;
    if(out==="BIG"){ if(stage===0){stage=2;continue;} return 7; }
    if(out==="ADV"){ if(stage===2)return 7; stage++; continue; }
    return stage===2?(Math.random()<0.74?3:0):0; // STALL
  }
  return 0;
}
function liveOvertime(){
  const L=state.live;
  const A=state.teams[L.h],B=state.teams[L.v];
  for(let r=0;r<5&&L.sh===L.sv;r++){
    const pa=autoDrivePts(A,B), pb=autoDrivePts(B,A);
    L.sh+=pa; L.sv+=pb;
    L.log.unshift({q:"OT",zone:1,off:L.h,playN:"OT",dcallN:"",ev:pa?"TD":"STALL",pts:pa,desc:T("overtime possession — {0} point(s)",pa),sh:L.sh,sv:L.sv});
    L.log.unshift({q:"OT",zone:1,off:L.v,playN:"OT",dcallN:"",ev:pb?"TD":"STALL",pts:pb,desc:T("overtime possession — {0} point(s)",pb),sh:L.sh,sv:L.sv});
  }
  if(L.sh===L.sv){
    if(Math.random()<0.5)L.sh+=3; else L.sv+=3;
    L.log.unshift({q:"OT",zone:1,off:L.sh>L.sv?L.h:L.v,playN:"FG",dcallN:"",ev:"FG",pts:3,desc:T("walk-off field goal!"),sh:L.sh,sv:L.sv});
  }
}
function liveCall(id){
  const L=state.live; if(!L||L.done)return;
  playLiveSeq(id);
  save(); render();
}
function liveSimRest(){
  const L=state.live; if(!L)return;
  let guard=0;
  while(!L.done&&guard++<600){
    if(L.pending) liveDecideAuto();
    else playLiveSeq(null);
  }
  save(); render();
}
function liveFinish(){
  const L=state.live; if(!L||!L.done)return;
  const res={h:L.h,v:L.v,sh:L.sh,sv:L.sv,winner:L.sh>L.sv?L.h:L.v};
  state.live=null;
  advanceWeek(res);
}
function liveQuit(){
  if(!confirm("Abandon coach mode? The rest of the game will be simulated."))return;
  liveSimRest();
  liveFinish();
}

/* --- L1-5: poll movement --- */
function pollMove(id){
  const now=top25().indexOf(id);
  if(now<0) return null;
  if(!state.prevPoll||!state.prevPoll.length) return {r:now+1,fresh:false,d:0};
  const was=state.prevPoll.indexOf(id);
  if(was<0) return {r:now+1,fresh:true,d:0};
  return {r:now+1,fresh:false,d:was-now};
}
function moveTag(id){
  const m=pollMove(id);
  if(!m) return "";
  if(m.fresh) return `<span class="mv n">NEW</span>`;
  if(m.d>0) return `<span class="mv u">▲${m.d}</span>`;
  if(m.d<0) return `<span class="mv d">▼${-m.d}</span>`;
  return `<span class="mv" style="color:var(--faint)">–</span>`;
}

/* --- L1-1: weekly recap --- */
function buildRecap(games,label){
  const U=state.userTeam;
  const mine=games.find(g=>g.h===U||g.v===U)||null;
  const others=games.filter(g=>g.h!==U&&g.v!==U).map(g=>{
    const w=state.teams[g.winner], l=state.teams[g.winner===g.h?g.v:g.h];
    return {g,w:w.id,l:l.id,gap:l.prestige-w.prestige,margin:Math.abs(g.sh-g.sv),
      hi:Math.max(g.sh,g.sv),lo:Math.min(g.sh,g.sv)};
  });
  const heads=[];
  const up=others.slice().sort((a,b)=>b.gap-a.gap)[0];
  if(up&&up.gap>=10) heads.push({t:"UPSET",c:"up",
    s:`${SCHOOLS[up.w].n} stuns ${SCHOOLS[up.l].n} ${up.hi}–${up.lo}.`});
  const rt=others.slice().sort((a,b)=>b.margin-a.margin)[0];
  if(rt&&rt.margin>=28&&(!up||rt.g!==up.g)) heads.push({t:"ROUT",c:"rt",
    s:`${SCHOOLS[rt.w].n} rolls past ${SCHOOLS[rt.l].n} ${rt.hi}–${rt.lo}.`});
  const close=others.filter(x=>x.margin<=3).sort((a,b)=>a.margin-b.margin)[0];
  if(close&&heads.length<3&&close.g!==(up&&up.g)&&close.g!==(rt&&rt.g))
    heads.push({t:"THRILLER",c:"",s:`${SCHOOLS[close.w].n} edges ${SCHOOLS[close.l].n} ${close.hi}–${close.lo}.`});
  const unb=state.teams.filter(t=>t.losses===0&&t.wins>=3).length;
  if(unb&&heads.length<3) heads.push({t:"STREAKS",c:"",s:`${unb} program${unb>1?"s remain":" remains"} unbeaten.`});
  const movers=top25().slice(0,25).map(id=>({id,m:pollMove(id)}))
    .filter(x=>x.m&&(x.m.fresh||Math.abs(x.m.d)>=2)).slice(0,5);
  const d={label,heads,movers:movers.map(x=>x.id)};
  if(mine){
    const home=mine.h===U;
    d.us=home?mine.sh:mine.sv; d.them=home?mine.sv:mine.sh;
    d.opp=home?mine.v:mine.h; d.home=home;
  }
  d.rank=userRank();
  pushOvl({t:"recap",d});
}

    ${d.us!==undefined?`<div class="rscore">
      ${crestSVG(state.userTeam,44)}
      <div><div class="rs-v" style="color:${won?"var(--good)":"var(--bad)"}">${d.us}–${d.them}</div>
        <div class="rs-l">${d.home?"vs":"at"} ${esc(SCHOOLS[d.opp].n)}</div></div>
      <div style="margin-left:auto;text-align:right">
        <div class="rs-v">${u.wins}–${u.losses}</div><div class="rs-l">record${d.rank?" · #"+d.rank:""}</div></div>

    <div class="cols2">

        ${d.heads.map(h=>`<div class="hl-item"><span class="hl-tag ${h.c}">${h.t}</span><span>${esc(h.s)}</span></div>`).join("")||'<div class="muted" style="font-size:13px">A quiet week around the league.</div>'}
      </div>

  const bar=(l,v,max)=>`<div class="attr"><span class="attr-l">${l}</span>
